// GEAR HOLO 3D — voxelize ASCII item art, rotate, rasterize back into a
// terminal cell grid. Pure functions, no DOM — runs in browser and node.

const CW = 8, CH = 14, ASPECT = CH / CW; // terminal cell metrics
const FRAME_RE = /[║═╔╗╚╝╠╣╦╩╬╫╪┌┐└┘├┤┬┴┼│─]/;

// char class → voxel depth (layers). Frame + solid blocks read as chassis.
function charDepth(ch) {
  if (ch === "█") return 4;
  if (ch === "▓") return 3;
  if (ch === "▒" || ch === "░") return 2;
  if (FRAME_RE.test(ch)) return 4;
  return 2;
}

// item.art (rows of chars) → voxel list in cell-width units, centered on origin.
// y is scaled by ASPECT so the model keeps card proportions in 3D space.
// The card is a relief: every char's FRONT face sits on one shared plane
// (z = -zoff) and depth extrudes backwards — coplanar fronts keep the
// front-on projection at one uniform scale, i.e. pixel-exact art.
function voxelize(item) {
  const rows = item.art;
  const H = rows.length;
  const W = Math.max(...rows.map((r) => r.length));
  const STEP = 0.9;
  let maxDepth = 1;
  for (const row of rows) for (const ch of row) if (ch !== " ") maxDepth = Math.max(maxDepth, charDepth(ch));
  const zoff = (STEP * (maxDepth - 1)) / 2;
  const vox = [];
  for (let y = 0; y < H; y++) {
    const row = rows[y];
    for (let x = 0; x < row.length; x++) {
      const ch = row[x];
      if (ch === " ") continue;
      const depth = charDepth(ch);
      const frame = FRAME_RE.test(ch);
      for (let k = 0; k < depth; k++) {
        vox.push({
          x: x - W / 2 + 0.5,
          y: (y - H / 2 + 0.5) * ASPECT,
          z: k * STEP - zoff,
          ch,
          frame,
          k,
        });
      }
    }
  }
  // bounding radius for camera distance / focal fit
  let r2 = 0;
  for (const v of vox) r2 = Math.max(r2, v.x * v.x + v.y * v.y + v.z * v.z);
  return { vox, radius: Math.sqrt(r2), frontZ: zoff };
}

// Render one frame into flat char/color buffers (cols*rows).
// colorOf(voxel, band) → color key; band 0 near … 2 far.
function renderFrame(model, yaw, pitch, cols, rows, chars, colors) {
  const { vox, radius, frontZ } = model;
  const D = radius * 2.6; // camera distance
  // fit projected radius into ~82% of the smaller stage half-extent (in cw units),
  // but never let the shared front plane exceed 1:1 cell magnification — front-on
  // must reproduce the art exactly, without doubled glyphs or rounding holes.
  const half = Math.min(cols / 2, (rows / 2) * ASPECT) * 0.82;
  const f = Math.min((half * D) / radius, D - frontZ);
  const cy = Math.cos(yaw), sy = Math.sin(yaw);
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  const n = cols * rows;
  chars.fill(" ", 0, n);
  colors.fill(0, 0, n);
  const zbuf = renderFrame._z && renderFrame._z.length >= n ? renderFrame._z : (renderFrame._z = new Float32Array(n));
  zbuf.fill(Infinity, 0, n);

  // facing: how front-on the card is (+1 front, -1 back, 0 edge-on)
  const facing = cy * cp;
  const showGlyphs = Math.abs(facing) > 0.55;
  // nearly face-on: drop the depth layers so back voxels can't peek through
  // gaps at fractionally-reduced scale and duplicate glyphs — the resting
  // view must be the art, character for character
  const flat = Math.abs(facing) > 0.95;
  const zNear = D - radius, zSpan = 2 * radius || 1;

  for (let i = 0; i < vox.length; i++) {
    const v = vox[i];
    if (flat && v.k > 0) continue;
    // yaw around vertical axis
    const x1 = v.x * cy + v.z * sy;
    const z1 = -v.x * sy + v.z * cy;
    // pitch around horizontal axis
    const y2 = v.y * cp - z1 * sp;
    const z2 = v.y * sp + z1 * cp;
    const zc = z2 + D;
    if (zc < 0.5) continue;
    const col = Math.round(cols / 2 + (f * x1) / zc - 0.5);
    const row = Math.round(rows / 2 + (f * y2) / zc / ASPECT - 0.5);
    if (col < 0 || col >= cols || row < 0 || row >= rows) continue;
    const idx = row * cols + col;
    if (zc >= zbuf[idx]) continue;
    zbuf[idx] = zc;
    const q = (zc - zNear) / zSpan; // 0 near … 1 far
    const band = q < 0.45 ? 0 : q < 0.7 ? 1 : 2;
    chars[idx] = showGlyphs ? v.ch : band === 0 ? "█" : band === 1 ? "▓" : "░";
    colors[idx] = (v.frame ? 1 : 0) | (band << 1); // bit0 frame, bits1-2 depth band
  }
  return facing;
}

// GEAR HOLO 3D — viewer app. Engine + ITEMS are inlined above this script.
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const term = document.getElementById("term");
const readout = document.getElementById("readout");
const statsEl = document.getElementById("stats");
const btnAuto = document.getElementById("auto");

// "green" appears as an edge value for BRK items; the green token class is fg
const colorClass = (c) => (c === "green" ? "fg" : c);

let idx = Math.max(0, ITEMS.findIndex((i) => i.id === "ice_mil"));
let model = voxelize(ITEMS[idx]);
let yaw = REDUCED ? 0.55 : 0.0;
let pitch = REDUCED ? -0.22 : 0.0;
let auto = !REDUCED;
let dragging = false;

let cols = 0, rows = 0, cells = [], chars = [], colors = [], prevC = [], prevK = [];

function rebuild() {
  cols = Math.min(Math.floor(innerWidth / 8), 64);
  rows = Math.min(Math.floor((innerHeight - 22 - 18) / 14), 40);
  term.style.setProperty("--cols", cols);
  term.style.setProperty("--rows", rows);
  term.textContent = "";
  cells = [];
  const frag = document.createDocumentFragment();
  for (let i = 0; i < cols * rows; i++) {
    const s = document.createElement("span");
    s.className = "cell";
    s.textContent = " ";
    frag.appendChild(s);
    cells.push(s);
  }
  term.appendChild(frag);
  chars = new Array(cols * rows);
  colors = new Array(cols * rows);
  prevC = new Array(cols * rows).fill(" ");
  prevK = new Array(cols * rows).fill("cell");
  dirty = true;
}

function setItem(i) {
  idx = (i + ITEMS.length) % ITEMS.length;
  const it = ITEMS[idx];
  model = voxelize(it);
  readout.textContent = `${it.n} · ${it.rarname} · ${it.cat} · ${idx + 1}/${ITEMS.length}`;
  statsEl.textContent = it.stats.join(" · ");
  dirty = true;
}

let dirty = true;
let last = 0;
function frame(t) {
  requestAnimationFrame(frame);
  if (t - last < 33) return; // ~30fps is plenty for cell motion
  const dt = Math.min(t - last, 100) / 1000;
  last = t;
  if (auto && !dragging) {
    yaw += dt * 0.7;
    if (yaw > Math.PI) yaw -= 2 * Math.PI;
    dirty = true;
  }
  if (!dirty) return;
  dirty = false;
  const it = ITEMS[idx];
  const cBody = colorClass(it.c), cEdge = colorClass(it.edge);
  renderFrame(model, yaw, pitch, cols, rows, chars, colors);
  for (let i = 0; i < cols * rows; i++) {
    const ch = chars[i];
    let k;
    if (ch === " ") k = "cell";
    else {
      const frame_ = colors[i] & 1, band = colors[i] >> 1;
      k = "cell " + (band === 2 ? "dim" : frame_ ? cEdge : cBody);
    }
    if (ch !== prevC[i]) { cells[i].textContent = ch; prevC[i] = ch; }
    if (k !== prevK[i]) { cells[i].className = k; prevK[i] = k; }
  }
}

// drag to rotate (mouse + touch)
let px = 0, py = 0;
term.addEventListener("pointerdown", (e) => {
  dragging = true; px = e.clientX; py = e.clientY;
  term.setPointerCapture(e.pointerId);
});
term.addEventListener("pointermove", (e) => {
  if (!dragging) return;
  yaw += (e.clientX - px) * 0.009;
  pitch = Math.max(-1.25, Math.min(1.25, pitch + (e.clientY - py) * 0.009));
  if (yaw > Math.PI) yaw -= 2 * Math.PI;
  if (yaw < -Math.PI) yaw += 2 * Math.PI;
  px = e.clientX; py = e.clientY;
  dirty = true;
});
addEventListener("pointerup", () => (dragging = false));

document.getElementById("prev").onclick = () => setItem(idx - 1);
document.getElementById("next").onclick = () => setItem(idx + 1);
document.getElementById("cat").onclick = () => {
  const cat = ITEMS[idx].cat;
  let j = idx;
  while (ITEMS[j].cat === cat) j = (j + 1) % ITEMS.length;
  setItem(j);
};
btnAuto.classList.toggle("active", auto);
btnAuto.onclick = () => {
  auto = !auto;
  btnAuto.classList.toggle("active", auto);
};

addEventListener("resize", rebuild);
rebuild();
setItem(idx);
requestAnimationFrame(frame);

</script>
