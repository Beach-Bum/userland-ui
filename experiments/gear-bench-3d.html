// GEAR BENCH 3D — procedural "realistic hacker hardware" builders.
// Pure geometry/texture code: takes THREE + an item record, returns a Group.
// Runs in browser and (with a stubbed document) in node for testing.

const BENCH_PAL = {
  fg: "#49ee5d", green: "#49ee5d", dim: "#526b55", cyan: "#20c8d2",
  yellow: "#e8c94c", red: "#e3313b", purple: "#b34fea", blue: "#359be8",
  orange: "#c87524",
};
const RAR_TIER = { BRK: 0, COM: 1, TUN: 2, RARE: 3, LEG: 4, EPIC: 5, MIL: 6, MYTH: 7 };

// deterministic per-item rng so layouts are stable between loads
function benchRng(seed) {
  let h = 2166136261;
  for (let i = 0; i < seed.length; i++) {
    h ^= seed.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return function () {
    h += 0x6d2b79f5;
    let t = h;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function buildGearModule(THREE, item) {
  const rng = benchRng(item.id);
  const tier = RAR_TIER[item.rar] ?? 1;
  const accent = BENCH_PAL[item.c] || BENCH_PAL.fg;
  const edgeCol = BENCH_PAL[item.edge] || BENCH_PAL.fg;
  const broken = tier === 0;
  const mil = item.cat === "MILDEV" || item.rar === "MIL";
  const glow = (broken ? 0.35 : 0.55 + tier * 0.16);

  const g = new THREE.Group();

  // ---------- shared materials ----------
  const M = {
    metal: new THREE.MeshStandardMaterial({ color: 0x8a9094, metalness: 0.9, roughness: 0.35 }),
    darkMetal: new THREE.MeshStandardMaterial({ color: 0x23282b, metalness: 0.85, roughness: 0.45 }),
    gold: new THREE.MeshStandardMaterial({ color: 0xc9a227, metalness: 1.0, roughness: 0.3 }),
    epoxy: new THREE.MeshStandardMaterial({ color: 0x0b0d0e, metalness: 0.1, roughness: 0.55 }),
    plastic: new THREE.MeshStandardMaterial({ color: 0x101314, metalness: 0.0, roughness: 0.8 }),
    accent: new THREE.MeshStandardMaterial({
      color: 0x060806, emissive: new THREE.Color(accent), emissiveIntensity: glow,
      metalness: 0.3, roughness: 0.5,
    }),
    glass: new THREE.MeshStandardMaterial({
      color: 0x9fd8c0, metalness: 0.1, roughness: 0.08, transparent: true, opacity: 0.22,
      side: THREE.DoubleSide, depthWrite: false,
    }),
  };

  // ---------- canvas texture helpers ----------
  function canvasTex(w, h, draw) {
    const cv = document.createElement("canvas");
    cv.width = w; cv.height = h;
    draw(cv.getContext("2d"), w, h);
    return new THREE.CanvasTexture(cv);
  }

  function pcbTexture(w, h) {
    return canvasTex(512, Math.round((512 * h) / w), (c, W, H) => {
      const base = mil ? "#101314" : "#07140c";
      const trace = mil ? "#2a3338" : "#11301c";
      c.fillStyle = base; c.fillRect(0, 0, W, H);
      c.strokeStyle = trace; c.lineWidth = 3;
      const n = 26 + tier * 4;
      for (let i = 0; i < n; i++) { // manhattan traces
        let x = rng() * W, y = rng() * H;
        c.beginPath(); c.moveTo(x, y);
        for (let s = 0; s < 3; s++) {
          if (rng() < 0.5) x = Math.max(8, Math.min(W - 8, x + (rng() - 0.5) * W * 0.4));
          else y = Math.max(8, Math.min(H - 8, y + (rng() - 0.5) * H * 0.4));
          c.lineTo(x, y);
        }
        c.stroke();
        c.fillStyle = "#c9a227"; // via
        c.beginPath(); c.arc(x, y, 4, 0, 7); c.fill();
      }
      c.strokeStyle = trace; c.lineWidth = 2;
      c.strokeRect(10, 10, W - 20, H - 20); // ground pour border
      c.fillStyle = "#c9d4c9"; // silkscreen
      c.font = "700 22px ui-monospace,Menlo,Consolas,monospace";
      c.fillText(item.tag + "-" + item.id.toUpperCase(), 24, 40);
      c.font = "700 16px ui-monospace,Menlo,Consolas,monospace";
      c.fillText(item.corp + " · REV 0." + (tier + 1), 24, 64);
      c.fillText("⏚ " + item.rarname, 24, H - 24);
      c.fillStyle = "#c9a227"; // edge connector fingers
      const fw = W / 30;
      for (let i = 0; i < 14; i++) c.fillRect(W * 0.18 + i * fw * 1.4, H - 14, fw, 14);
      if (broken) { // scorch + crack
        for (let i = 0; i < 3; i++) {
          const x = rng() * W, y = rng() * H, r = 30 + rng() * 50;
          const gr = c.createRadialGradient(x, y, 4, x, y, r);
          gr.addColorStop(0, "rgba(0,0,0,0.85)"); gr.addColorStop(1, "rgba(0,0,0,0)");
          c.fillStyle = gr; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill();
        }
        c.strokeStyle = "rgba(220,228,220,0.5)"; c.lineWidth = 2;
        c.beginPath(); c.moveTo(rng() * W, 0);
        for (let s = 1; s < 6; s++) c.lineTo(rng() * W, (H * s) / 5);
        c.stroke();
      }
    });
  }

  function chipTexture(label) {
    return canvasTex(128, 128, (c) => {
      c.fillStyle = "#0b0d0e"; c.fillRect(0, 0, 128, 128);
      c.fillStyle = "#aeb6ae";
      c.font = "700 18px ui-monospace,Menlo,Consolas,monospace";
      c.fillText(label.slice(0, 9), 10, 56);
      c.font = "700 13px ui-monospace,Menlo,Consolas,monospace";
      c.fillText("LOT " + Math.floor(rng() * 9000 + 1000), 10, 78);
      c.beginPath(); c.arc(18, 108, 7, 0, 7); c.fill(); // pin-1 dot
    });
  }

  function screenTexture(lines) {
    return canvasTex(256, 128, (c) => {
      c.fillStyle = "#040604"; c.fillRect(0, 0, 256, 128);
      c.font = "700 15px ui-monospace,Menlo,Consolas,monospace";
      lines.forEach((ln, i) => {
        c.fillStyle = i === 0 ? accent : "#69806d";
        c.fillText(ln, 10, 26 + i * 22);
      });
      for (let x = 0; x < 12; x++) { // ticker bars
        c.fillStyle = rng() < 0.5 ? accent : "#37503d";
        const bh = 8 + rng() * 26;
        c.fillRect(12 + x * 20, 122 - bh, 12, bh);
      }
      c.fillStyle = "rgba(0,0,0,0.3)";
      for (let y = 0; y < 128; y += 3) c.fillRect(0, y, 256, 1);
    });
  }

  function irisTexture() {
    return canvasTex(128, 128, (c) => {
      const gr = c.createRadialGradient(64, 64, 4, 64, 64, 62);
      gr.addColorStop(0, accent); gr.addColorStop(0.25, "#0c1410");
      gr.addColorStop(0.6, accent + "44"); gr.addColorStop(1, "#050705");
      c.fillStyle = gr; c.fillRect(0, 0, 128, 128);
      c.strokeStyle = accent + "66";
      for (let r = 12; r < 62; r += 10) { c.beginPath(); c.arc(64, 64, r, 0, 7); c.stroke(); }
    });
  }

  // ---------- shared component builders (y-up, board top at y=0) ----------
  const add = (mesh, x, y, z, ry) => {
    mesh.position.set(x, y, z);
    if (ry) mesh.rotation.y = ry;
    g.add(mesh);
    return mesh;
  };

  function board(w, d) {
    const tex = pcbTexture(w, d);
    const top = new THREE.MeshStandardMaterial({ map: tex, metalness: 0.15, roughness: 0.7 });
    const side = M.darkMetal;
    const b = new THREE.Mesh(new THREE.BoxGeometry(w, 0.5, d), [side, side, top, side, side, side]);
    b.position.y = -0.25;
    g.add(b);
    for (const [sx, sz] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) { // corner screws
      const s = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.32, 0.18, 12), M.gold);
      s.position.set(sx * (w / 2 - 0.8), 0.06, sz * (d / 2 - 0.8));
      g.add(s);
    }
    return b;
  }

  function chip(w, d, h, label, x, z, ry) {
    const sub = new THREE.Group();
    const top = new THREE.MeshStandardMaterial({ map: chipTexture(label), metalness: 0.1, roughness: 0.5 });
    const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), [M.epoxy, M.epoxy, top, M.epoxy, M.epoxy, M.epoxy]);
    body.position.y = h / 2;
    sub.add(body);
    const pins = Math.max(3, Math.floor(d / 0.55));
    for (let i = 0; i < pins; i++) { // gull-wing pins on ±x
      const pz = -d / 2 + (i + 0.5) * (d / pins);
      for (const sx of [-1, 1]) {
        const p = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.12, 0.22), M.metal);
        p.position.set(sx * (w / 2 + 0.15), 0.06, pz);
        sub.add(p);
      }
    }
    sub.position.set(x, 0, z);
    if (ry) sub.rotation.y = ry;
    if (broken && rng() < 0.4) { sub.rotation.z = (rng() - 0.5) * 0.3; sub.position.y += 0.1; }
    g.add(sub);
    return sub;
  }

  function heatsink(w, d, h, x, z) {
    const sub = new THREE.Group();
    const base = new THREE.Mesh(new THREE.BoxGeometry(w, 0.3, d), M.metal);
    base.position.y = 0.15;
    sub.add(base);
    const fins = 7;
    for (let i = 0; i < fins; i++) {
      if (broken && i === 3) continue; // snapped fin
      const f = new THREE.Mesh(new THREE.BoxGeometry(0.18, h, d), M.metal);
      f.position.set(-w / 2 + (i + 0.5) * (w / fins), 0.3 + h / 2, 0);
      sub.add(f);
    }
    sub.position.set(x, 0, z);
    g.add(sub);
    return sub;
  }

  function cap(x, z, h = 1.1, r = 0.42) {
    const sub = new THREE.Group();
    const body = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 14), M.darkMetal);
    body.position.y = h / 2;
    sub.add(body);
    const top = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.96, r * 0.96, 0.06, 14), M.metal);
    top.position.y = h + 0.03;
    sub.add(top);
    sub.position.set(x, 0, z);
    if (broken && rng() < 0.3) sub.rotation.x = (rng() - 0.5) * 0.5; // blown cap lean
    g.add(sub);
    return sub;
  }

  function led(x, z, on = true) {
    const m = on ? M.accent : M.plastic;
    const l = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.18, 0.5), m);
    l.position.set(x, 0.09, z);
    g.add(l);
    return l;
  }

  function pinHeader(n, x, z, ry) {
    const sub = new THREE.Group();
    const base = new THREE.Mesh(new THREE.BoxGeometry(n * 0.5, 0.3, 0.5), M.plastic);
    base.position.y = 0.15;
    sub.add(base);
    for (let i = 0; i < n; i++) {
      const p = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.8, 0.1), M.gold);
      p.position.set(-n * 0.25 + (i + 0.5) * 0.5, 0.55, 0);
      sub.add(p);
    }
    sub.position.set(x, 0, z);
    if (ry) sub.rotation.y = ry;
    g.add(sub);
    return sub;
  }

  function antenna(x, z, h = 4.2) {
    const sub = new THREE.Group();
    const mount = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.4, 0.5, 10), M.gold);
    mount.position.y = 0.25;
    sub.add(mount);
    const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.12, h, 8), M.darkMetal);
    rod.position.y = 0.5 + h / 2;
    sub.add(rod);
    const tip = new THREE.Mesh(new THREE.SphereGeometry(0.16, 10, 8), M.accent);
    tip.position.y = 0.5 + h + 0.1;
    sub.add(tip);
    sub.position.set(x, 0, z);
    if (broken) sub.rotation.z = 0.5; // bent antenna
    g.add(sub);
    return sub;
  }

  function wire(points, r = 0.09, mat = M.accent) {
    const curve = new THREE.CatmullRomCurve3(points.map((p) => new THREE.Vector3(...p)));
    const t = new THREE.Mesh(new THREE.TubeGeometry(curve, 24, r, 6), mat);
    g.add(t);
    return t;
  }

  function screenPanel(w, h, lines, x, z, tiltDeg) {
    const sub = new THREE.Group();
    const frame = new THREE.Mesh(new THREE.BoxGeometry(w + 0.5, h + 0.5, 0.35), M.darkMetal);
    sub.add(frame);
    const face = new THREE.Mesh(
      new THREE.PlaneGeometry(w, h),
      new THREE.MeshStandardMaterial({
        color: 0x000000, emissive: 0xffffff, emissiveIntensity: glow,
        emissiveMap: screenTexture(lines), roughness: 0.4, metalness: 0.1,
      })
    );
    face.position.z = 0.19;
    sub.add(face);
    const legL = new THREE.Mesh(new THREE.BoxGeometry(0.3, h * 0.7, 0.3), M.metal);
    legL.position.set(-w / 2 + 0.4, -h * 0.55, -0.5);
    legL.rotation.x = -0.5;
    sub.add(legL);
    const legR = legL.clone();
    legR.position.x = w / 2 - 0.4;
    sub.add(legR);
    sub.position.set(x, h / 2 + 0.8, z);
    sub.rotation.x = (-tiltDeg * Math.PI) / 180;
    g.add(sub);
    return sub;
  }

  // ---------- per-category modules ----------
  const B = {
    CORE() {
      board(16, 12);
      chip(5.5, 5.5, 0.7, item.tag + " CPU", 0, -0.5);
      heatsink(5.2, 5.2, 1.7, 0, -0.5);
      const glowBar = new THREE.Mesh(new THREE.BoxGeometry(5.6, 0.18, 5.6), M.accent);
      glowBar.position.set(0, 0.74, -0.5);
      g.add(glowBar);
      for (let i = 0; i < 4 + tier; i++) cap(-6.5 + i * 1.3, 4.2, 1.1 + (i % 2) * 0.25);
      chip(2, 3, 0.4, "VRM-" + tier, 5.8, 3.5);
      pinHeader(8, -4.5, -5.0);
      led(7, -5, true); led(7, -4.2, tier > 2);
      if (tier >= 6) antenna(-7, -4.5, 3.2);
    },
    LENS() {
      board(15, 11);
      const sub = new THREE.Group();
      const stages = [[2.6, 1.2, M.darkMetal], [2.2, 2.2, M.metal], [1.9, 0.9, M.gold]];
      let zoff = 0;
      for (const [r, len, mat] of stages) {
        const c = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 24), mat);
        c.rotation.x = Math.PI / 2;
        c.position.z = zoff + len / 2;
        sub.add(c);
        zoff += len;
      }
      const iris = new THREE.Mesh(
        new THREE.CircleGeometry(1.7, 24),
        new THREE.MeshStandardMaterial({
          color: 0x000000, emissive: 0xffffff, emissiveIntensity: glow, emissiveMap: irisTexture(),
        })
      );
      iris.position.z = zoff + 0.01;
      sub.add(iris);
      sub.position.set(-2, 2.6, -1.2);
      g.add(sub);
      const mount = new THREE.Mesh(new THREE.BoxGeometry(3.2, 2.6, 2.6), M.darkMetal);
      mount.position.set(-2, 1.3, -2.2);
      g.add(mount);
      chip(2.4, 3.2, 0.45, item.tag + "-DSP", 4.5, 2.8);
      for (let i = 0; i < 3 + (tier >> 1); i++) cap(3.2 + i * 1.2, -3.6, 0.9);
      wire([[-2, 2.6, -3.5], [0.5, 1.2, -4.2], [3.5, 0.3, -3.4], [4.5, 0.25, 2.0]], 0.09, M.accent);
      led(6.3, 4.2, true);
    },
    PORT() {
      board(15, 11);
      const cage = new THREE.Mesh(new THREE.BoxGeometry(8.5, 2.6, 3.4), M.metal);
      cage.position.set(-1, 1.3, 3.0);
      g.add(cage);
      for (let i = 0; i < 3; i++) { // jack openings
        const open = i === 1 && broken;
        const hole = new THREE.Mesh(
          new THREE.BoxGeometry(1.9, 1.5, 0.4),
          open ? M.accent : new THREE.MeshStandardMaterial({ color: 0x020303, roughness: 0.95 })
        );
        hole.position.set(-3.5 + i * 2.6, 1.2, 4.75);
        g.add(hole);
        const tongue = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.2, 0.3), M.gold);
        tongue.position.set(-3.5 + i * 2.6, 0.7, 4.7);
        g.add(tongue);
      }
      for (let i = 0; i < 7; i++) { // EMI fingers
        const f = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.14, 0.6), M.gold);
        f.position.set(-4 + i * 1.1, 2.68, 3.0);
        g.add(f);
      }
      chip(3, 3, 0.5, item.tag + "-PHY", 3.8, -2.2);
      pinHeader(10, -3, -4.4);
      for (let i = 0; i < 2 + (tier >> 1); i++) cap(5.5, -4.2 + i * 1.2, 0.85);
      led(6.6, 4.2, true); led(5.8, 4.2, tier > 1);
    },
    BUS() {
      board(18, 11);
      for (let s = 0; s < 3; s++) { // backplane slots
        const slot = new THREE.Mesh(new THREE.BoxGeometry(12, 0.9, 0.9), M.plastic);
        slot.position.set(-1, 0.45, -3.4 + s * 2.4);
        g.add(slot);
        const key = new THREE.Mesh(new THREE.BoxGeometry(11.4, 0.5, 0.18), M.accent);
        key.position.set(-1, 0.95, -3.4 + s * 2.4);
        g.add(key);
      }
      // ribbon cable arching off the board
      const ribbonMat = new THREE.MeshStandardMaterial({ color: 0x2c343a, roughness: 0.85, side: THREE.DoubleSide });
      for (let k = 0; k < 5; k++) {
        const curve = new THREE.CatmullRomCurve3([
          new THREE.Vector3(5.4, 0.4, -3.4 + k * 0.16),
          new THREE.Vector3(7.6, 2.4 + k * 0.05, -2.4),
          new THREE.Vector3(9.0, 0.6, 0.8),
        ]);
        g.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 20, 0.16, 5), k === 0 ? M.accent : ribbonMat));
      }
      chip(2.6, 2.6, 0.5, "XBAR", -6.4, 3.6);
      chip(2.0, 2.6, 0.4, "ARB-" + tier, -2.8, 3.8);
      for (let i = 0; i < 4; i++) led(2.5 + i * 0.9, 4.2, rng() < 0.5 || tier > 3);
      pinHeader(6, 6.6, 3.8, Math.PI / 2);
    },
    ICE() {
      board(15, 10);
      const holder = new THREE.Mesh(new THREE.BoxGeometry(3.4, 1.8, 2.6), M.darkMetal);
      holder.position.set(-4.2, 0.9, 0);
      g.add(holder);
      // blade: stretched 4-sided pyramid lying along +x
      const blade = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 1.15, 9.5, 4), mil ? M.darkMetal : M.metal);
      blade.rotation.z = -Math.PI / 2;
      blade.rotation.y = Math.PI / 4;
      blade.scale.z = 0.32; // flatten into a blade
      blade.position.set(0.3, 1.0, 0);
      g.add(blade);
      const edge = new THREE.Mesh(new THREE.BoxGeometry(8.2, 0.1, 0.12), M.accent); // honed edge glow
      edge.position.set(0.1, 1.45, 0);
      g.add(edge);
      if (tier >= 5) for (let i = 0; i < 3; i++) { // serrations
        const s = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.4, 1.1, 4), M.metal);

      const sma = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 1.2, 10), M.gold); // probe jack
      sma.rotation.x = Math.PI / 2;
      sma.position.set(-6.9, 0.9, -3.2);
      g.add(sma);
      chip(2.6, 2.2, 0.45, "ARM-" + item.tag, -4.4, 3.2);
      cap(-1.5, 3.6, 1.0); cap(-0.2, 3.6, 1.2);
      led(5.5, 3.8, true);
      wire([[-4.2, 1.8, 0], [-5.5, 2.6, -1.6], [-6.9, 1.0, -3.0]], 0.08, M.accent);
    },
    SKIN() {
      board(15, 11);
      for (let i = 0; i < 4; i++) { // overlapping cloak scales
        if (broken && i === 2) continue;
        const plate = new THREE.Mesh(new THREE.BoxGeometry(11 - i * 1.6, 0.16, 4.6), i % 2 ? M.darkMetal : M.metal);
        plate.position.set(-0.5 + i * 0.5, 1.1 + i * 0.55, -1.2 + i * 0.7);
        plate.rotation.z = 0.04 * (i % 2 ? 1 : -1);
        g.add(plate);
        const strip = new THREE.Mesh(new THREE.BoxGeometry(10.6 - i * 1.6, 0.06, 0.2), M.accent);
        strip.position.set(-0.5 + i * 0.5, 1.2 + i * 0.55, 1.0 + i * 0.7);
        g.add(strip);
      }
      chip(2.6, 2.6, 0.45, "ID-NULL", -5.4, 3.8);
      cap(-2.4, 4.0, 0.9); cap(-1.2, 4.0, 0.9);
      led(6.4, 4.4, tier > 0);
    },
    CACHE() {
      board(14, 11);
      const layers = 3 + Math.min(3, tier);
      for (let i = 0; i < layers; i++) { // stacked memory dies
        const die = chip(6.2, 4.2, 0.5, "MEM" + i + "·" + item.tag, -1.5, -0.8);
        die.position.y = i * 0.8;
      }
      for (const [sx, sz] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) { // stack posts
        const post = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, layers * 0.8, 8), M.gold);
        post.position.set(-1.5 + sx * 3.4, layers * 0.4, -0.8 + sz * 2.4);
        g.add(post);
      }
      for (let i = 0; i < layers; i++) led(4.4, -2.4 + i * 0.9, i < layers - (broken ? 2 : 0));
      chip(2.2, 2.6, 0.4, "CTRL", 4.8, 2.8);
      pinHeader(8, -3.5, 4.4);
    },
    DEF() {
      board(15, 11);
      const bracket = new THREE.Mesh(new THREE.BoxGeometry(1.0, 3.4, 1.0), M.darkMetal);
      bracket.position.set(0, 1.7, -2.4);
      g.add(bracket);
      const mirror = new THREE.Mesh(
        new THREE.BoxGeometry(8.4, 6.2, 0.22),
        new THREE.MeshStandardMaterial({ color: 0xc7d6cf, metalness: 1.0, roughness: 0.06 })
      );
      mirror.position.set(0, 3.6, -1.9);
      mirror.rotation.x = -0.32;
      g.add(mirror);
      const rim = new THREE.Mesh(new THREE.BoxGeometry(8.8, 6.6, 0.1), M.accent);
      rim.position.set(0, 3.62, -2.05);
      rim.rotation.x = -0.32;
      g.add(rim);
      heatsink(4.4, 2.6, 1.1, -4.2, 3.4);
      chip(2.4, 2.4, 0.45, "MIRROR", 4.4, 3.4);
      cap(1.4, 4.0, 1.0); cap(2.6, 4.0, 0.8);
      led(6.4, 4.4, true);
    },
    AUTO() {
      board(14, 11);
      const base = new THREE.Mesh(new THREE.BoxGeometry(6.4, 0.8, 5.2), M.darkMetal);
      base.position.set(-2, 0.4, -0.6);
      g.add(base);
      const stages = 3 + Math.min(2, tier >> 1);
      for (let i = 0; i < stages; i++) { // relay/daemon tower
        const mod = new THREE.Mesh(new THREE.BoxGeometry(5.6 - i * 0.5, 1.0, 4.4 - i * 0.4), i % 2 ? M.plastic : M.darkMetal);
        mod.position.set(-2, 1.3 + i * 1.1, -0.6);
        g.add(mod);
        const lamp = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.14), (i < stages - (broken ? 1 : 0)) ? M.accent : M.plastic);
        lamp.position.set(-2 + (5.6 - i * 0.5) / 2 - 0.6, 1.3 + i * 1.1, -0.6 + (4.4 - i * 0.4) / 2 + 0.08);
        g.add(lamp);
      }
      for (const sx of [-1, 1]) { // tower rails
        const rail = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, stages * 1.1 + 0.8, 8), M.metal);
        rail.position.set(-2 + sx * 2.4, (stages * 1.1) / 2 + 0.6, -3.0);
        g.add(rail);
      }
      chip(2.4, 3.0, 0.45, "QUEUE", 4.4, -1.5);
      pinHeader(8, 3.8, 3.8);
      cap(1.6, 4.0, 1.0);
      led(6.0, 4.4, true);
    },
    MARKET() {
      board(15, 11);
      screenPanel(9, 4.4, [item.tag + " EXCHANGE FEED", "BID 04.2K ASK 04.6K", "VOL ▲ " + (12 + tier * 7) + "%"], -0.8, -1.6, 18);
      chip(2.6, 2.6, 0.5, "TICK", 5.6, 2.4);
      for (let i = 0; i < 3 + (tier >> 1); i++) cap(-5.8 + i * 1.2, 4.0, 0.9);
      pinHeader(10, 0, 4.6);
      led(6.6, 4.4, true); led(6.6, 3.6, tier > 2);
    },
    SOUL() {
      board(14, 11);
      const die = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.35, 2.2), M.accent);
      die.position.set(-1.5, 0.18, -0.5);
      g.add(die);
      const pedestal = new THREE.Mesh(new THREE.CylinderGeometry(2.9, 3.2, 0.4, 24), M.gold);
      pedestal.position.set(-1.5, 0.2, -0.5);
      pedestal.position.y = 0.0;
      g.add(pedestal);
      const dome = new THREE.Mesh(new THREE.SphereGeometry(3.0, 24, 14, 0, Math.PI * 2, 0, Math.PI / 2), M.glass);
      dome.position.set(-1.5, 0.1, -0.5);
      g.add(dome);
      for (let i = 0; i < 5; i++) { // gold bond wires
        const a = (i / 5) * Math.PI * 2 + 0.4;
        wire(
          [[-1.5 + Math.cos(a) * 0.9, 0.45, -0.5 + Math.sin(a) * 0.9],
           [-1.5 + Math.cos(a) * 1.8, 1.1, -0.5 + Math.sin(a) * 1.8],
           [-1.5 + Math.cos(a) * 2.6, 0.15, -0.5 + Math.sin(a) * 2.6]],
          0.045, M.gold
        );
      }
      chip(2.4, 2.8, 0.45, "PSYCHE", 4.6, -1.8);
      cap(4.0, 2.6, 0.9); cap(5.2, 2.6, 1.1);
      led(6.0, 4.4, true);
      if (broken) dome.scale.set(1, 0.62, 1); // cracked-down dome
    },
    MILDEV() {
      board(16, 12);
      const hull = new THREE.Mesh(new THREE.BoxGeometry(11, 2.6, 7), M.darkMetal);
      hull.position.set(-0.5, 1.3, -0.5);
      g.add(hull);
      const lid = new THREE.Mesh(new THREE.BoxGeometry(11.4, 0.35, 7.4), M.metal);
      lid.position.set(-0.5, 2.75, -0.5);
      g.add(lid);
      for (const [sx, sz] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) { // armor bolts
        const b = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.3, 6), M.gold);
        b.position.set(-0.5 + sx * 5.2, 2.95, -0.5 + sz * 3.2);
        g.add(b);
      }
      const stripe = new THREE.Mesh(new THREE.BoxGeometry(11.4, 0.36, 0.8), M.accent); // threat stripe
      stripe.position.set(-0.5, 2.76, 2.2);
      g.add(stripe);
      const keyed = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.9, 0.9, 12), M.metal); // keyed connector
      keyed.rotation.x = Math.PI / 2;
      keyed.position.set(4.2, 1.3, 3.1);
      g.add(keyed);
      const notch = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.5, 0.3), M.darkMetal);
      notch.position.set(4.2, 1.9, 3.3);
      g.add(notch);
      antenna(-5.6, -4.6, 4.6);
      if (tier >= 6) antenna(-3.8, -4.9, 3.2);
      const handle = new THREE.Mesh(new THREE.TubeGeometry(
        new THREE.CatmullRomCurve3([
          new THREE.Vector3(-4.5, 3.0, -0.5), new THREE.Vector3(-0.5, 4.1, -0.5), new THREE.Vector3(3.5, 3.0, -0.5),
        ]), 16, 0.18, 8), M.metal);
      g.add(handle);
      led(5.8, 4.6, true); led(5.0, 4.6, true);
    },
  };

  (B[item.cat] || B.CORE)();
  return g;
}


// GEAR BENCH 3D — viewer shell. ITEMS + buildGearModule inlined above.
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const readout = document.getElementById("readout");
const statsEl = document.getElementById("stats");
const host = document.getElementById("host");
const btnAuto = document.getElementById("auto");

if (typeof THREE === "undefined") {
  readout.textContent = "THREE.JS FAILED TO LOAD — INTERNET CONNECTION REQUIRED";
  throw new Error("three.js missing");
}

let idx = Math.max(0, ITEMS.findIndex((i) => i.id === "core_myth"));
let yaw = REDUCED ? 0.65 : 0.4, pitch = REDUCED ? -0.35 : -0.3;
let auto = !REDUCED, dragging = false, needsRender = true;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x030303);
scene.fog = new THREE.Fog(0x030303, 60, 140);
const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 500);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
host.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xa8c0a8, 0.5));
const key = new THREE.DirectionalLight(0xfff4e0, 1.0);
key.position.set(18, 30, 22);
scene.add(key);
const fill = new THREE.DirectionalLight(0x49ee5d, 0.22);
fill.position.set(-24, 10, -10);
scene.add(fill);
const accentLight = new THREE.PointLight(0x49ee5d, 0.9, 80);
accentLight.position.set(0, 14, 10);
scene.add(accentLight);

let group = null, camDist = 50;
function disposeGroup() {
  if (!group) return;
  group.traverse((o) => {
    if (o.geometry) o.geometry.dispose();
    const mats = Array.isArray(o.material) ? o.material : o.material ? [o.material] : [];
    for (const m of mats) {
      if (m.map) m.map.dispose();
      if (m.emissiveMap) m.emissiveMap.dispose();
      m.dispose();
    }
  });
  scene.remove(group);
  group = null;
}

function setItem(i) {
  idx = (i + ITEMS.length) % ITEMS.length;
  const it = ITEMS[idx];
  disposeGroup();
  group = buildGearModule(THREE, it);
  // center on bounds, fit camera
  const box = new THREE.Box3().setFromObject(group);
  const c = new THREE.Vector3(), s = new THREE.Vector3();
  box.getCenter(c); box.getSize(s);
  group.position.sub(c);
  camDist = Math.max(s.x, s.y * 1.6, s.z) * 1.45 + 8;
  accentLight.color.set(BENCH_PAL[it.edge] || BENCH_PAL.fg);
  scene.add(group);
  readout.textContent = `${it.n} · ${it.rarname} · ${it.cat} · ${idx + 1}/${ITEMS.length} · BENCH`;
  statsEl.textContent = it.stats.join(" · ");
  needsRender = true;
}

function resize() {
  const w = host.clientWidth, h = host.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  needsRender = true;
}

let last = 0;
function frame(t) {
  requestAnimationFrame(frame);
  const dt = Math.min(t - last, 100) / 1000;
  last = t;
  if (auto && !dragging) {
    yaw += dt * 0.5;
    needsRender = true;
  }
  if (!needsRender || !group) return;
  needsRender = false;
  const cp = Math.max(-1.45, Math.min(1.45, pitch));
  camera.position.set(
    Math.sin(yaw) * Math.cos(cp) * camDist,
    -Math.sin(cp) * camDist,
    Math.cos(yaw) * Math.cos(cp) * camDist
  );
  camera.lookAt(0, 0, 0);
  renderer.render(scene, camera);
}

let px = 0, py = 0;
renderer.domElement.addEventListener("pointerdown", (e) => {
  dragging = true; px = e.clientX; py = e.clientY;
  renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener("pointermove", (e) => {
  if (!dragging) return;
  yaw += (e.clientX - px) * 0.008;
  pitch = Math.max(-1.45, Math.min(1.45, pitch + (e.clientY - py) * 0.008));
  px = e.clientX; py = e.clientY;
  needsRender = true;
});
addEventListener("pointerup", () => (dragging = false));

document.getElementById("prev").onclick = () => setItem(idx - 1);
document.getElementById("next").onclick = () => setItem(idx + 1);
document.getElementById("cat").onclick = () => {
  const cat = ITEMS[idx].cat;
  let j = idx;
  while (ITEMS[j].cat === cat) j = (j + 1) % ITEMS.length;
  setItem(j);
};
btnAuto.classList.toggle("active", auto);
btnAuto.onclick = () => {
  auto = !auto;
  btnAuto.classList.toggle("active", auto);
};

addEventListener("resize", resize);
setItem(idx);
resize();
requestAnimationFrame(frame);

</script>
