<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Userland — pure chat skeleton</title>
<style>
/* ================================================================
   PURE STOAT-STYLE CHAT SKELETON — structure pass only.
   Map: docs/ui/stoat-pure-ui-map.md
   Neutral dark chat-app styling. NO Userland/Bento identity:
   no bone/ink, no Gamja, no Space Mono UI, no pixel glyphs,
   no HUD, no phone shell, no packet styling.
   ================================================================ */
:root{
  --bg-0:#141518;          /* server rail */
  --bg-1:#1b1d22;          /* channel list */
  --bg-2:#232529;          /* chat surface */
  --bg-3:#2b2e34;          /* hover / cards */
  --bg-4:#34373e;          /* inputs / embeds */
  --txt:#e3e5e8;
  --txt-2:#9a9da3;
  --txt-3:#6c6f76;
  --accent:#6573e8;
  --accent-2:#4853b8;
  --ok:#3aa55d;
  --warn:#d8b13c;
  --danger:#d84040;
  --r:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg-2);color:var(--txt);font-size:14px;line-height:1.45;overflow:hidden}
button{font-family:inherit;border:0;cursor:pointer}

/* ============ App shell: rail | channels | chat ============ */
.app{display:flex;height:100%}

/* server/community rail */
.rail{width:64px;flex:none;background:var(--bg-0);display:flex;flex-direction:column;
  align-items:center;gap:10px;padding:12px 0}
.rail__srv{width:44px;height:44px;border-radius:50%;background:var(--bg-3);color:var(--txt);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;
  cursor:pointer;transition:border-radius .15s,background .15s}
.rail__srv:hover{border-radius:14px}
.rail__srv.is-on{border-radius:14px;background:var(--accent);color:#fff}
.rail__sep{width:28px;border-top:1px solid var(--bg-3)}

/* channel list */
.chans{width:230px;flex:none;background:var(--bg-1);display:flex;flex-direction:column}
.chans__head{padding:14px 16px;font-weight:700;font-size:15px;border-bottom:1px solid rgba(0,0,0,.25)}
.chans__list{flex:1;overflow-y:auto;padding:10px 8px;display:flex;flex-direction:column;gap:1px}
.chans__label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;
  color:var(--txt-3);padding:10px 8px 4px}
.chan{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:5px;color:var(--txt-2);
  cursor:pointer;font-weight:500}
.chan:hover{background:var(--bg-3);color:var(--txt)}
.chan.is-on{background:var(--bg-3);color:var(--txt)}
.chan .hash{color:var(--txt-3);font-weight:400}
.chan .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chan.has-unread{color:var(--txt);font-weight:600}
.chan .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;display:none}
.chan.has-unread .dot{display:block}

/* user/account card pinned at bottom (Stoat UserMenu) */
.me{flex:none;display:flex;align-items:center;gap:8px;padding:8px 10px;background:rgba(0,0,0,.2)}
.me .ava{cursor:pointer}
.me__txt{flex:1;min-width:0;cursor:pointer}
.me__name{font-size:13px;font-weight:600;line-height:1.2}
.me__status{font-size:11px;color:var(--txt-2)}
.me__gear{width:30px;height:30px;border-radius:6px;background:transparent;color:var(--txt-2);font-size:15px}
.me__gear:hover{background:var(--bg-3);color:var(--txt)}

/* chat column */
.chat{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg-2)}
.chead{flex:none;display:flex;align-items:center;gap:8px;padding:11px 16px;
  border-bottom:1px solid rgba(0,0,0,.25)}
.chead .burger{display:none;width:30px;height:30px;border-radius:6px;background:transparent;
  color:var(--txt-2);font-size:17px}
.chead .hash{color:var(--txt-3);font-size:17px}
.chead .nm{font-weight:700;font-size:15px}
.chead .topic{color:var(--txt-2);font-size:13px;margin-left:8px;border-left:1px solid var(--bg-4);
  padding-left:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ============ Feed ============ */
.feed{flex:1;min-height:0;overflow-y:auto;padding:14px 16px 4px;display:flex;flex-direction:column}
.convstart{padding:8px 0 14px;margin-bottom:6px;border-bottom:1px solid var(--bg-3)}
.convstart h2{font-size:22px;margin-bottom:2px}
.convstart p{color:var(--txt-2);font-size:13px}

.msg{display:flex;gap:12px;padding:2px 6px;margin-top:14px;border-radius:6px}
.msg:hover{background:rgba(0,0,0,.12)}
.msg.is-grp{margin-top:0}
.msg .ava-slot{width:38px;flex:none}
.msg__col{flex:1;min-width:0}
.msg__head{display:flex;align-items:baseline;gap:8px}
.msg__who{font-weight:600;font-size:14px;cursor:pointer}
.msg__who:hover{text-decoration:underline}
.msg__time{font-size:11px;color:var(--txt-3)}
.msg__body{color:var(--txt);font-size:14px;overflow-wrap:break-word;padding:1px 0}
.msg.is-grp .msg__body{color:var(--txt)}

.ava{width:38px;height:38px;border-radius:50%;flex:none;display:flex;align-items:center;
  justify-content:center;font-weight:700;font-size:14px;color:#fff;cursor:pointer;user-select:none}

.sysmsg{display:flex;align-items:center;gap:10px;margin-top:14px;padding:2px 6px;color:var(--txt-2);
  font-size:13px}
.sysmsg .ico{width:38px;text-align:center;color:var(--txt-3)}

.divider{display:flex;align-items:center;gap:10px;margin-top:16px;color:var(--txt-3);
  font-size:11px;font-weight:600}
.divider::before,.divider::after{content:"";flex:1;border-top:1px solid var(--bg-3)}

/* ============ Embeds (market / contract / auction) ============ */
.embed{width:fit-content;max-width:min(100%,420px);margin-top:6px;background:var(--bg-3);
  border-left:4px solid var(--accent);border-radius:6px;padding:12px 14px}
.embed--ok{border-left-color:var(--ok)}
.embed--warn{border-left-color:var(--warn)}
.embed__kicker{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;
  color:var(--txt-2);margin-bottom:3px}
.embed__title{font-weight:700;font-size:14px}
.embed__desc{color:var(--txt-2);font-size:13px;margin-top:2px}
.embed__fields{display:flex;gap:18px;margin-top:8px;flex-wrap:wrap}
.embed__field b{display:block;font-size:11px;font-weight:600;color:var(--txt-2);text-transform:uppercase}
.embed__field span{font-size:13px}
.embed__acts{display:flex;gap:8px;margin-top:10px}

.btn{height:32px;padding:0 14px;border-radius:5px;background:var(--bg-4);color:var(--txt);
  font-size:13px;font-weight:600}
.btn:hover{background:#3d4047}
.btn--primary{background:var(--accent);color:#fff}
.btn--primary:hover{background:var(--accent-2)}
.btn--danger{background:var(--danger);color:#fff}
.btn--ghost{background:transparent;color:var(--txt-2)}
.btn--ghost:hover{background:var(--bg-3);color:var(--txt)}

/* ============ Typing + composer ============ */
.typing{flex:none;height:20px;padding:0 22px;font-size:12px;color:var(--txt-2);visibility:hidden}
.typing.is-vis{visibility:visible}
.composer{flex:none;display:flex;align-items:center;gap:8px;margin:0 16px 18px;
  background:var(--bg-4);border-radius:10px;padding:6px 8px 6px 12px}
.composer .plus{width:30px;height:30px;border-radius:50%;background:var(--bg-3);color:var(--txt-2);
  font-size:16px;flex:none}
.composer .plus:hover{color:var(--txt)}
.composer input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--txt);
  font-size:14px;font-family:inherit}
.composer input::placeholder{color:var(--txt-3)}
.composer .send{width:32px;height:32px;border-radius:6px;background:transparent;color:var(--accent);
  font-size:17px;flex:none}
.composer .send:hover{background:var(--bg-3)}

/* ============ Modal layer (one shell, many renderers) ============ */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;
  justify-content:center;z-index:50;padding:20px}
.scrim.is-vis{display:flex}
.modal{background:var(--bg-1);border-radius:10px;width:440px;max-width:100%;max-height:90vh;
  overflow-y:auto;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.modal--wide{width:760px;display:flex;overflow:hidden;height:min(560px,90vh)}

/* profile modal (Stoat Profile.* composition) */
.pf__banner{height:110px;background:linear-gradient(120deg,#3a3f63,#2c4a48);border-radius:10px 10px 0 0;
  position:relative}
.pf__ava{position:absolute;left:18px;bottom:-28px;width:72px;height:72px;border-radius:50%;
  border:5px solid var(--bg-1)}
.pf__ava .ava{width:100%;height:100%;font-size:24px}
.pf__body{padding:38px 18px 18px}
.pf__name{font-size:19px;font-weight:700}
.pf__handle{color:var(--txt-2);font-size:13px}
.pf__status{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:13px;color:var(--txt-2)}
.pf__status .st-dot{width:9px;height:9px;border-radius:50%;background:var(--ok)}
.pf__chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{background:var(--bg-3);border-radius:99px;padding:3px 10px;font-size:12px;color:var(--txt-2)}
.pf__sect{margin-top:14px;background:var(--bg-2);border-radius:8px;padding:10px 12px}
.pf__sect h4{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
  color:var(--txt-2);margin-bottom:6px}
.pf__row{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;color:var(--txt)}
.pf__row span:first-child{color:var(--txt-2)}
.pf__acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.pf__acts .btn{flex:1;min-width:90px}

/* settings modal (two-pane: nav list + content) */
.set__nav{width:200px;flex:none;background:var(--bg-0);padding:18px 10px;display:flex;
  flex-direction:column;gap:2px;overflow-y:auto}
.set__nav h4{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--txt-3);
  padding:8px 10px 4px}
.set__item{text-align:left;padding:7px 10px;border-radius:5px;background:transparent;
  color:var(--txt-2);font-size:14px;font-weight:500}
.set__item:hover{background:var(--bg-3);color:var(--txt)}
.set__item.is-on{background:var(--bg-3);color:var(--txt)}
.set__item--danger{color:var(--danger)}
.set__content{flex:1;min-width:0;padding:22px;overflow-y:auto}
.set__content h2{font-size:18px;margin-bottom:14px}
.set__card{background:var(--bg-2);border-radius:8px;padding:14px;margin-bottom:10px}
.set__card h4{font-size:12px;font-weight:700;text-transform:uppercase;color:var(--txt-2);margin-bottom:6px}
.set__card p{font-size:13px;color:var(--txt-2)}
.set__close{position:absolute;top:14px;right:16px;width:32px;height:32px;border-radius:50%;
  background:var(--bg-3);color:var(--txt-2);font-size:15px}
.set__close:hover{color:var(--txt)}

/* generic detail modal body */
.dm__body{padding:18px}
.dm__kicker{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--txt-2)}
.dm__title{font-size:18px;font-weight:700;margin:2px 0 10px}
.dm__acts{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}

/* ============ responsive: collapse nav under 720px ============ */
@media (max-width:720px){
  .rail{display:none}
  .chans{position:fixed;inset:0 auto 0 0;z-index:40;transform:translateX(-100%);
    transition:transform .2s ease;width:260px;box-shadow:4px 0 24px rgba(0,0,0,.4)}
  .chans.is-open{transform:none}
  .chead .burger{display:block}
  .modal--wide{flex-direction:column;height:90vh}
  .set__nav{width:100%;flex-direction:row;flex-wrap:wrap;padding:10px}
}
</style>
</head>
<body>

<div class="app">

  <!-- server rail -->
  <nav class="rail">
    <div class="rail__srv is-on" title="Userland">U</div>
    <div class="rail__sep"></div>
    <div class="rail__srv" title="placeholder">+</div>
  </nav>

  <!-- channel list -->
  <aside class="chans" id="chans">
    <div class="chans__head">Userland</div>
    <div class="chans__list" id="chan-list"></div>
    <div class="me">
      <span class="ava me-ava" data-profile="ned" style="background:#7b68c9">N</span>
      <div class="me__txt" data-profile="ned">
        <div class="me__name">ned</div>
        <div class="me__status">Online</div>
      </div>
      <button class="me__gear" data-modal="settings" title="settings">⚙</button>
    </div>
  </aside>

  <!-- chat column -->
  <main class="chat">
    <div class="chead">
      <button class="burger" id="burger">☰</button>
      <span class="hash">#</span><span class="nm" id="ch-name"></span>
      <span class="topic" id="ch-topic"></span>
    </div>
    <div class="feed" id="feed"></div>
    <div class="typing" id="typing"></div>
    <div class="composer">
      <button class="plus" title="attach">+</button>
      <input id="composer-in" placeholder="Message #relay" autocomplete="off">
      <button class="send" id="send" title="send">➤</button>
    </div>
  </main>

</div>

<!-- modal layer -->
<div class="scrim" id="scrim"></div>

<script>
/* ============ data ============ */
const USERS={
  ned:    {name:'ned',      handle:'@ned#0001',     color:'#7b68c9', status:'Online',
           level:14, title:'Night Hauler', rep:'+62 trusted', guild:'JADENET Dispatch',
           worth:'12,450 SEN', badges:['Founding Courier','Route I','Clean Manifest'],
           listings:[['Aura Cell','450 SEN'],['Route Stamp — Gate 17','120 SEN']]},
  orla:   {name:'Orla Vex', handle:'@orlavex#7741', color:'#4e9a8f', status:'Online',
           level:31, title:'Manifest Reader', rep:'+118 trusted', guild:'Sable Customs',
           worth:'88,300 SEN', badges:['Customs Broker','Veteran','Mentor'],
           listings:[['Sable Customs Bridge Permit','1,200 SEN']]},
  meilan: {name:'Mei-Lan',  handle:'@meilan#2210',  color:'#b3703f', status:'Idle',
           level:22, title:'Convoy Lead', rep:'+74 trusted', guild:'Blackline Convoy',
           worth:'31,900 SEN', badges:['Convoy Founder','Hauler II'],
           listings:[]},
  reye:   {name:'Dolan Reye',handle:'@reye#0930',   color:'#5f7fc2', status:'Do Not Disturb',
           level:18, title:'Auction Broker', rep:'+41 neutral', guild:'Paradise Gate',
           worth:'54,000 SEN', badges:['Broker','Verified Seller'],
           listings:[['Foil Card — Night Hauler','2,400 SEN'],['Aura Cell (bulk)','—'],['Permit — Paradise Gate','900 SEN']]}
};

const CHANNELS=[
  {id:'global', label:'relay',    topic:'guild relay — open channel', group:'Relay'},
  {id:'crew',   label:'guild',    topic:'Blackline Convoy — private', group:'Relay'},
  {id:'dm',     label:'mail',     topic:'Orla Vex', group:'Relay'},
  {id:'market', label:'market',   topic:'cargo, cards & permits', group:'Guild Floor'},
  {id:'runs',   label:'contracts',topic:'contract leads & convoy calls', group:'Guild Floor'},
  {id:'system', label:'customs',  topic:'customs & service notices', group:'Guild Floor'}
];

/* messages: {who,t,text} | {sys:true,text} | {who,t,embed:{...}} */
const T=h=>h; // times as plain strings for the skeleton
const MSGS={
  global:[
    {sys:true,text:'Welcome to #relay. Keep manifests clean and routes quiet.'},
    {who:'orla',  t:'09:12',text:'Morning haulers. Red Stamp is inspecting at Gate 17 — pad your customs window.'},
    {who:'orla',  t:'09:12',text:'If you stamped your permits last cycle you are fine.'},
    {who:'meilan',t:'09:15',text:'Blackline convoy forms for the Deep Pit salvage route after lunch. One seat open.'},
    {who:'ned',   t:'09:16',text:'I can take it. Need to craft a permit first.'},
    {who:'meilan',t:'09:16',text:'Bring an Aura Cell, the route runs hot.'},
    {who:'reye',  t:'09:31',text:'New auction lots dropping in #market shortly.'},
    {who:'reye',  t:'09:31',embed:{kind:'auction',kicker:'Auction update',title:'AURA CELL ▲ 4.2%',
      desc:'Aura Cell cargo is up after the Gate 17 customs squeeze.',cls:'embed--warn',
      fields:[['Top bid','38.10 SEN'],['Change','+4.2%'],['Lots','High']],
      acts:[['View','view'],['Bid','bid']]}},
    {who:'orla',  t:'09:33',text:'Called it.'}
  ],
  crew:[
    {sys:true,text:'You joined #guild — Blackline Convoy.'},
    {who:'meilan',t:'08:40',text:'Convoy muster tonight. Bring your couriers and a stamped permit.'},
    {who:'meilan',t:'08:41',embed:{kind:'contract',kicker:'Contract lead',title:'Deep Pit Salvage Haul',
      desc:'3 of 4 couriers committed · medium risk · even split of SEN.',cls:'embed--ok',
      fields:[['Reward','600 SEN'],['Risk','Medium'],['Convoy','3/4']],
      acts:[['Join','join'],['View','view']]}},
    {who:'ned',   t:'08:55',text:'Looking at the manifest now.'},
    {who:'meilan',t:'09:02',embed:{kind:'card',kicker:'Card pull',title:'FOIL — Night Hauler',
      desc:'Mei-Lan pulled a foil prestige card from a guild-favor parcel.',cls:'',
      fields:[['Rarity','Foil'],['Album','Couriers'],['Dupes','0']],
      acts:[['Open','open'],['Flex','view']]}}
  ],
  dm:[
    {sys:true,text:'This is the beginning of your mail with Orla Vex.'},
    {who:'orla',t:'Yesterday',text:'You still owe me for the Sable Customs Bridge permit.'},
    {who:'ned', t:'Yesterday',text:'I know, I know. After the next contract clears.'},
    {who:'orla',t:'09:35',text:'Today, ideally. Customs won’t wait.'}
  ],
  market:[
    {sys:true,text:'Listings posted here are escrow-protected. SEN is held until delivery.'},
    {who:'reye',t:'09:40',embed:{kind:'listing',kicker:'Market listing',title:'Aura Cell — sealed',
      desc:'Class-2 power cell. Runs hot routes. Sold as-is.',cls:'',
      fields:[['Price','2,400 SEN'],['Seller','Dolan Reye'],['Escrow','Yes']],
      acts:[['Buy','buy'],['Inspect','inspect']]}},
    {who:'reye',t:'09:41',embed:{kind:'listing',kicker:'Market listing',title:'Permit — Paradise Gate',
      desc:'Single passage. Transfers on purchase. No refunds past customs.',cls:'',
      fields:[['Price','900 SEN'],['Seller','Dolan Reye'],['Escrow','Yes']],
      acts:[['Buy','buy'],['Inspect','inspect']]}},
    {who:'ned',t:'09:44',text:'Is the cell stamped for the Natural World Leak Route?'},
    {who:'reye',t:'09:45',text:'Sold as-is means sold as-is.'}
  ],
  runs:[
    {sys:true,text:'Open contract leads and convoy calls appear here.'},
    {who:'meilan',t:'09:02',embed:{kind:'contract',kicker:'Contract lead',title:'Alpine Lifeline Run',
      desc:'Low-risk medical cargo. Two couriers, one route, one hour.',cls:'embed--ok',
      fields:[['Reward','250 SEN'],['Risk','Low'],['Convoy','1/2']],
      acts:[['Join','join'],['View','view']]}},
    {who:'orla',t:'09:20',embed:{kind:'warn',kicker:'Manifest risk',title:'Red Stamp inspection — Gate 17',
      desc:'Routes through Gate 17 face Red Stamp inspection. Mismatched manifests get seized.',cls:'embed--warn',
      fields:[['Zone','Gate 17'],['Risk','High'],['Hold','Likely']],
      acts:[['View','view'],['Reroute','inspect']]}},
    {who:'ned',t:'09:48',embed:{kind:'result',kicker:'Contract result',title:'Sable Customs Bridge — delivered',
      desc:'Parcel cleared customs. SEN, reputation and a route stamp returned.',cls:'embed--ok',
      fields:[['SEN','+420'],['Rep','+6'],['Stamp','Sable Bridge']],
      acts:[['View','view'],['Claim','open']]}}
  ],
  system:[
    {sys:true,text:'Customs and service notices only. Nobody can post here.'},
    {who:'orla',t:'07:00',embed:{kind:'warn',kicker:'Customs notice',title:'Sable Customs Bridge — closure',
      desc:'Crossings pause tonight 02:00–02:20 UTC for a Red Stamp sweep.',cls:'embed--warn',
      fields:[['Impact','Routes'],['Duration','20 min']],
      acts:[['View','view']]}},
    {sys:true,text:'A parcel is waiting in your hold. Open it on the Parcels board.'}
  ]
};

const state={chan:'global',unread:{crew:true,market:true},modal:null};

/* ============ render: channel list ============ */
function renderChans(){
  let html='',lastGroup='';
  CHANNELS.forEach(c=>{
    if(c.group!==lastGroup){lastGroup=c.group;html+=`<div class="chans__label">${c.group}</div>`}
    const on=c.id===state.chan;
    html+=`<div class="chan ${on?'is-on':''} ${state.unread[c.id]?'has-unread':''}" data-chan="${c.id}">
      <span class="hash">#</span><span class="nm">${c.label}</span><span class="dot"></span></div>`;
  });
  $('chan-list').innerHTML=html;
}

/* ============ render: feed with grouping ============
   Stoat Messages.tsx tail rule: group when same author and the
   previous entry is a normal message (system breaks groups).   */
function renderFeed(){
  const ch=CHANNELS.find(c=>c.id===state.chan);
  $('ch-name').textContent=ch.label;
  $('ch-topic').textContent=ch.topic;
  $('composer-in').placeholder='Message #'+ch.label;

  const list=MSGS[state.chan];
  let html=`<div class="convstart"><h2># ${ch.label}</h2><p>This is the start of #${ch.label}. ${ch.topic}.</p></div>`;
  let prev=null;
  list.forEach(m=>{
    if(m.sys){
      html+=`<div class="sysmsg"><span class="ico">→</span>${m.text}</div>`;
      prev=null;return;
    }
    const u=USERS[m.who];
    const grp=prev&&prev.who===m.who&&!prev.sys;
    const body=m.embed?renderEmbed(m.embed):esc(m.text);
    if(grp){
      html+=`<div class="msg is-grp"><div class="ava-slot"></div>
        <div class="msg__col"><div class="msg__body">${body}</div></div></div>`;
    }else{
      html+=`<div class="msg"><div class="ava-slot">
          <span class="ava" data-profile="${m.who}" style="background:${u.color}">${u.name[0].toUpperCase()}</span></div>
        <div class="msg__col">
          <div class="msg__head"><span class="msg__who" data-profile="${m.who}">${u.name}</span>
            <span class="msg__time">${m.t}</span></div>
          <div class="msg__body">${body}</div>
        </div></div>`;
    }
    prev=m;
  });
  $('feed').innerHTML=html;
  $('feed').scrollTop=$('feed').scrollHeight;
}

function renderEmbed(e){
  return `<div class="embed ${e.cls||''}">
    <div class="embed__kicker">${e.kicker}</div>
    <div class="embed__title">${e.title}</div>
    <div class="embed__desc">${e.desc}</div>
    <div class="embed__fields">${e.fields.map(([k,v])=>
      `<div class="embed__field"><b>${k}</b><span>${v}</span></div>`).join('')}</div>
    <div class="embed__acts">${e.acts.map(([lbl,act],i)=>
      `<button class="btn ${i===0?'btn--primary':''}" data-embed-act="${act}" data-embed-kind="${e.kind}" data-embed-title="${e.title}">${lbl}</button>`).join('')}</div>
  </div>`;
}

const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);

/* ============ modal shell: openModal(type, props) ============ */
function openModal(type,props={}){
  state.modal=type;
  $('scrim').innerHTML=MODALS[type](props);
  $('scrim').classList.add('is-vis');
}
function closeModal(){
  state.modal=null;
  $('scrim').classList.remove('is-vis');
  $('scrim').innerHTML='';
}

const MODALS={
  /* --- user profile popout (Stoat Profile.* order: banner → identity
         → status → badges → fields → actions) --- */
  profile(p){
    const u=USERS[p.id];
    return `<div class="modal" data-stop>
      <div class="pf__banner">
        <div class="pf__ava"><span class="ava" style="background:${u.color}">${u.name[0].toUpperCase()}</span></div>
      </div>
      <div class="pf__body">
        <div class="pf__name">${u.name}</div>
        <div class="pf__handle">${u.handle} · Level ${u.level} · ${u.title}</div>
        <div class="pf__status"><span class="st-dot"></span>${u.status}</div>
        <div class="pf__chips">${u.badges.map(b=>`<span class="chip">${b}</span>`).join('')}</div>
        <div class="pf__sect"><h4>Standing</h4>
          <div class="pf__row"><span>Reputation</span><span>${u.rep}</span></div>
          <div class="pf__row"><span>Guild</span><span>${u.guild}</span></div>
          <div class="pf__row"><span>SEN balance</span><span>${u.worth}</span></div>
        </div>
        <div class="pf__sect"><h4>Public listings (${u.listings.length})</h4>
          ${u.listings.length?u.listings.map(([n,pr])=>
            `<div class="pf__row"><span>${n}</span><span>${pr}</span></div>`).join('')
            :'<div class="pf__row"><span>Nothing listed</span><span>—</span></div>'}
        </div>
        <div class="pf__acts">
          <button class="btn btn--primary">Message</button>
          <button class="btn">Trade</button>
          <button class="btn">View listings</button>
          <button class="btn">View guild</button>
          <button class="btn">View album</button>
        </div>
      </div>
    </div>`;
  },

  /* --- settings/account: two-pane modal (Stoat Settings) --- */
  settings(p){
    const page=p.page||'profile';
    const NAV=[['User',['profile','account','appearance']],
               ['App',['notifications','privacy','donor & cosmetics']],
               ['',['log out']]];
    const CONTENT={
      profile:`<h2>Profile</h2>
        <div class="set__card"><h4>Display name</h4><p>ned</p></div>
        <div class="set__card"><h4>Title</h4><p>Night Hauler (placeholder)</p></div>
        <div class="set__card"><h4>Banner & avatar</h4><p>Upload placeholders go here.</p></div>`,
      account:`<h2>Account</h2>
        <div class="set__card"><h4>Handle</h4><p>@ned#0001</p></div>
        <div class="set__card"><h4>Email</h4><p>ned@example.com</p></div>
        <div class="set__card"><h4>Password</h4><p>········ <button class="btn" style="margin-left:8px">Change</button></p></div>`,
      appearance:`<h2>Appearance</h2>
        <div class="set__card"><h4>Theme</h4><p>Dark (skeleton default)</p></div>
        <div class="set__card"><h4>Density</h4><p>Comfortable</p></div>`,
      notifications:`<h2>Notifications</h2>
        <div class="set__card"><h4>Mentions</h4><p>On</p></div>
        <div class="set__card"><h4>Auction alerts</h4><p>On</p></div>`,
      privacy:`<h2>Privacy</h2>
        <div class="set__card"><h4>Who can message you</h4><p>Everyone</p></div>
        <div class="set__card"><h4>Show SEN balance on profile</h4><p>On (placeholder)</p></div>`,
      'donor & cosmetics':`<h2>Donor & cosmetics</h2>
        <div class="set__card"><h4>Supporter tier</h4><p>None — placeholder surface for rig cosmetics.</p></div>`,
      'log out':`<h2>Log out</h2>
        <div class="set__card"><p>Placeholder. No session to end in the skeleton.</p>
        <p style="margin-top:8px"><button class="btn btn--danger">Log out</button></p></div>`
    };
    return `<div class="modal modal--wide" data-stop style="position:relative">
      <div class="set__nav">
        ${NAV.map(([h,items])=>(h?`<h4>${h}</h4>`:'<h4>&nbsp;</h4>')+items.map(i=>
          `<button class="set__item ${i===page?'is-on':''} ${i==='log out'?'set__item--danger':''}"
            data-set-page="${i}">${i[0].toUpperCase()+i.slice(1)}</button>`).join('')).join('')}
      </div>
      <div class="set__content">${CONTENT[page]}</div>
      <button class="set__close" data-close>✕</button>
    </div>`;
  },

  /* --- generic detail modal: proves one shell holds parcel / contract /
         listing / auction / trade / notice --- */
  detail(p){
    const KIND={listing:'Market listing',contract:'Contract lead',auction:'Auction lot',
      result:'Contract result',card:'Card pull',warn:'Notice',parcel:'Parcel',
      trade:'Trade offer'}[p.kind]||'Detail';
    return `<div class="modal" data-stop>
      <div class="dm__body">
        <div class="dm__kicker">${KIND}</div>
        <div class="dm__title">${esc(p.title||'Untitled')}</div>
        <div class="set__card"><p>Placeholder body. The same modal shell renders
          profiles, settings, parcels, contracts, listings, auctions, cards and notices —
          only the inner renderer changes.</p></div>
        <div class="dm__acts">
          <button class="btn btn--ghost" data-close>Cancel</button>
          <button class="btn btn--primary">Confirm</button>
        </div>
      </div>
    </div>`;
  }
};

/* ============ events ============ */
document.addEventListener('click',e=>{
  const t=e.target;

  // channel switch
  const chan=t.closest('[data-chan]');
  if(chan){state.chan=chan.dataset.chan;delete state.unread[state.chan];
    $('chans').classList.remove('is-open');renderChans();renderFeed();return}

  // burger (mobile nav)
  if(t.closest('#burger')){$('chans').classList.toggle('is-open');return}

  // profile popout
  const prof=t.closest('[data-profile]');
  if(prof){openModal('profile',{id:prof.dataset.profile});return}

  // settings
  if(t.closest('[data-modal="settings"]')){openModal('settings',{});return}
  const sp=t.closest('[data-set-page]');
  if(sp){openModal('settings',{page:sp.dataset.setPage});return}

  // embed actions → generic detail modal
  const ea=t.closest('[data-embed-act]');
  if(ea){
    const act=ea.dataset.embedAct;
    const kind=act==='buy'?'listing':act==='join'?'contract':ea.dataset.embedKind;
    openModal('detail',{kind,title:ea.dataset.embedTitle});return;
  }

  // close modal
  if(t.closest('[data-close]')){closeModal();return}
  if(t.id==='scrim')closeModal();

  // send
  if(t.closest('#send'))send();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
$('composer-in').addEventListener('keydown',e=>{if(e.key==='Enter')send()});

function send(){
  const inp=$('composer-in');const txt=inp.value.trim();
  if(!txt)return;
  inp.value='';
  MSGS[state.chan].push({who:'ned',t:'now',text:txt});
  renderFeed();
  // canned reply with typing indicator in #dm and #global
  if(['dm','global'].includes(state.chan)){
    const ty=$('typing');
    setTimeout(()=>{ty.textContent='Orla Vex is typing…';ty.classList.add('is-vis')},500);
    setTimeout(()=>{
      ty.classList.remove('is-vis');
      MSGS[state.chan].push({who:'orla',t:'now',text:'Noted.'});
      renderFeed();
    },1700);
  }
}

renderChans();renderFeed();
</script>
