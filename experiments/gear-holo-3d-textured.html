v_epic","cat":"MILDEV","slot":"MIL","n":"RAIL AUTH","rar":"EPIC","rarname":"EPIC","corp":"MILSPEC","tag":"MIL","c":"blue","edge":"blue","intensity":6,"anim":"THREAT LOCK","stats":["POWER +24","STAB +21","TRACE +05","THREAT LOCK"],"art":["╔═══MIL EPIC MILD═══╗","║  ▄▄▄▄▄▄▄    ║      ","║ ║███████║   ║      ","║═╣ ARMORY╠═> ║      ","║ ║███████║   ║      ","║  ▀▀███▀▀    ║      ","║ THREAT LOCK ║      ","╚MILSPEC════════════╝"]},{"id":"mildev_mil","cat":"MILDEV","slot":"MIL","n":"SIEGE KEY","rar":"MIL","rarname":"MILITARY","corp":"MILSPEC","tag":"MIL","c":"red","edge":"red","intensity":7,"anim":"THREAT LOCK","stats":["POWER +28","STAB +24","TRACE +06","THREAT LOCK"],"art":["╔═══MIL MIL MILD════╗","║[A]═╦═[B]═╦[C]║     ","║    ║     ║  ║      ","║[D]═╬═[E]═╬[F]║     ","║    ║     ║  ║      ","║ OUT╩═════╩IN║      ","║ COMMAND RT  ║      ","╚MILSPEC════════════╝"]},{"id":"mildev_myth","cat":"MILDEV","slot":"MIL","n":"BLACK OPS CORE","rar":"MYTH","rarname":"MYTHIC","corp":"MILSPEC","tag":"MIL","c":"orange","edge":"orange","intensity":8,"anim":"THREAT LOCK","stats":["POWER +32","STAB +27","TRACE -07","THREAT LOCK"],"art":["╔═══MIL MYTH MILD═══╗","║  ▄▄▄▄▄▄▄    ║      ","║ ║███████║   ║      ","║═╣ ARMORY╠═> ║      ","║ ║███████║   ║      ","║  ▀▀███▀▀    ║      ","║ THREAT LOCK ║      ","╚MILSPEC════════════╝"]}];
// GEAR HOLO 3D / TEXTURED — Three.js variant. ITEMS inlined above.
// Each item: extruded slab, item art baked into an emissive phosphor canvas
// texture (scanlines included), metal sides, relief blocks for solid chars,
// additive glow halo. Drag orbit + auto spin. Workshop experiment, not canon.
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const FRAME_RE = /[║═╔╗╚╝╠╣╦╩╬╫╪┌┐└┘├┤┬┴┼│─]/;
const PAL = {
  fg: "#49ee5d", green: "#49ee5d", dim: "#526b55", cyan: "#20c8d2",
  yellow: "#e8c94c", red: "#e3313b", purple: "#b34fea", blue: "#359be8",
  orange: "#c87524",
};
const ASPECT = 14 / 8;

const readout = document.getElementById("readout");
const statsEl = document.getElementById("stats");
const host = document.getElementById("host");
const btnAuto = document.getElementById("auto");

if (typeof THREE === "undefined") {
  readout.textContent = "THREE.JS FAILED TO LOAD — INTERNET CONNECTION REQUIRED";
  throw new Error("three.js missing");
}

let idx = Math.max(0, ITEMS.findIndex((i) => i.id === "core_myth"));
let yaw = REDUCED ? 0.55 : 0, pitch = REDUCED ? -0.2 : 0;
let auto = !REDUCED, dragging = false, needsRender = true;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x030303);
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 500);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
host.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x9db89d, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 0.9);
key.position.set(14, 18, 26);
scene.add(key);
const rim = new THREE.DirectionalLight(0x49ee5d, 0.35);
rim.position.set(-20, -6, -18);
scene.add(rim);

// art → emissive phosphor texture (2x cell resolution + scanlines)
function buildFaceTexture(item) {
  const W = Math.max(...item.art.map((r) => r.length)), H = item.art.length;
  const cw = 16, ch = 28;
  const cv = document.createElement("canvas");
  cv.width = W * cw; cv.height = H * ch;
  const g = cv.getContext("2d");
  g.fillStyle = "#060806";
  g.fillRect(0, 0, cv.width, cv.height);
  g.textBaseline = "middle";
  g.textAlign = "center";
  g.font = "600 " + Math.round(ch * 0.78) + "px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace";
  for (let y = 0; y < H; y++) {
    const row = item.art[y];
    for (let x = 0; x < row.length; x++) {
      const chr = row[x];
      if (chr === " ") continue;
      g.fillStyle = PAL[FRAME_RE.test(chr) ? item.edge : item.c] || PAL.fg;
      const shade = chr === "█" ? 1 : chr === "▓" ? 0.7 : chr === "▒" ? 0.45 : chr === "░" ? 0.28 : 0;
      if (shade) {
        g.globalAlpha = shade;
        g.fillRect(x * cw, y * ch, cw, ch);
        g.globalAlpha = 1;
      } else {
        g.fillText(chr.toUpperCase(), x * cw + cw / 2, y * ch + ch / 2 + 1);
      }
    }
  }
  g.fillStyle = "rgba(0,0,0,0.28)"; // CRT scanlines
  for (let yy = 0; yy < cv.height; yy += 4) g.fillRect(0, yy, cv.width, 2);
  const tex = new THREE.CanvasTexture(cv);
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

function buildGlowTexture(hex) {
  const cv = document.createElement("canvas");
  cv.width = cv.height = 256;
  const g = cv.getContext("2d");
  const grad = g.createRadialGradient(128, 128, 10, 128, 128, 128);
  grad.addColorStop(0, hex + "55");
  grad.addColorStop(0.5, hex + "22");
  grad.addColorStop(1, hex + "00");
  g.fillStyle = grad;
  g.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(cv);
}

let group = null;
function disposeGroup() {
  if (!group) return;
  group.traverse((o) => {
    if (o.geometry) o.geometry.dispose();
    const mats = Array.isArray(o.material) ? o.material : o.material ? [o.material] : [];
    for (const m of mats) {
      if (m.map) m.map.dispose();
      if (m.emissiveMap) m.emissiveMap.dispose();
      m.dispose();
    }
  });
  scene.remove(group);
  group = null;
}

function setItem(i) {
  idx = (i + ITEMS.length) % ITEMS.length;
  const it = ITEMS[idx];
  disposeGroup();
  group = new THREE.Group();

  const W = Math.max(...it.art.map((r) => r.length)), H = it.art.length;
  const width = W, height = H * ASPECT, depth = 1.6;
  const faceTex = buildFaceTexture(it);
  const sideMat = new THREE.MeshStandardMaterial({ color: 0x121712, metalness: 0.85, roughness: 0.35 });
  const faceMat = new THREE.MeshStandardMaterial({
    color: 0x000000, emissive: 0xffffff, emissiveMap: faceTex,
    metalness: 0.2, roughness: 0.6,
  });
  // box faces: +x,-x,+y,-y,+z(front),-z(back)
  const slab = new THREE.Mesh(
    new THREE.BoxGeometry(width, height, depth),
    [sideMat, sideMat, sideMat, sideMat, faceMat, faceMat]
  );
  group.add(slab);

  // relief: solid art masses become raised blocks proud of the face
  const accent = new THREE.Color(PAL[it.c] || PAL.fg);
  const reliefMat = new THREE.MeshStandardMaterial({
    color: 0x060806, emissive: accent, emissiveIntensity: 0.55,
    metalness: 0.6, roughness: 0.4,
  });
  const reliefGeo = new THREE.BoxGeometry(1, ASPECT, 0.5);
  for (let y = 0; y < H; y++) {
    const row = it.art[y];
    for (let x = 0; x < row.length; x++) {
      if (row[x] !== "█" && row[x] !== "▓") continue;
      const m = new THREE.Mesh(reliefGeo, reliefMat);
      m.position.set(x - W / 2 + 0.5, (H / 2 - y - 0.5) * ASPECT, depth / 2 + 0.25);
      group.add(m);
    }
  }

  // additive holo halo behind the card
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: buildGlowTexture(PAL[it.edge] || PAL.fg),
    transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
  }));
  glow.scale.set(width * 2.2, width * 2.2, 1);
  glow.position.z = -depth;
  group.add(glow);

  scene.add(group);
  camera.position.set(0, 0, Math.max(width, height) * 2.35);
  camera.lookAt(0, 0, 0);
  readout.textContent = `${it.n} · ${it.rarname} · ${it.cat} · ${idx + 1}/${ITEMS.length} · TEXTURED`;
  statsEl.textContent = it.stats.join(" · ");
  needsRender = true;
}

function resize() {
  const w = host.clientWidth, h = host.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  needsRender = true;
}

let last = 0;
function frame(t) {
  requestAnimationFrame(frame);
  const dt = Math.min(t - last, 100) / 1000;
  last = t;
  if (auto && !dragging) {
    yaw += dt * 0.6;
    needsRender = true;
  }
  if (!needsRender || !group) return;
  needsRender = false;
  group.rotation.set(pitch, yaw, 0);
  renderer.render(scene, camera);
}

let px = 0, py = 0;
renderer.domElement.addEventListener("pointerdown", (e) => {
  dragging = true; px = e.clientX; py = e.clientY;
  renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener("pointermove", (e) => {
  if (!dragging) return;
  yaw += (e.clientX - px) * 0.008;
  pitch = Math.max(-1.25, Math.min(1.25, pitch + (e.clientY - py) * 0.008));
  px = e.clientX; py = e.clientY;
  needsRender = true;
});
addEventListener("pointerup", () => (dragging = false));

document.getElementById("prev").onclick = () => setItem(idx - 1);
document.getElementById("next").onclick = () => setItem(idx + 1);
document.getElementById("cat").onclick = () => {
  const cat = ITEMS[idx].cat;
  let j = idx;
  while (ITEMS[j].cat === cat) j = (j + 1) % ITEMS.length;
  setItem(j);
};
btnAuto.classList.toggle("active", auto);
btnAuto.onclick = () => {
  auto = !auto;
  btnAuto.classList.toggle("active", auto);
};

addEventListener("resize", resize);
setItem(idx);
resize();
requestAnimationFrame(frame);

</script>
