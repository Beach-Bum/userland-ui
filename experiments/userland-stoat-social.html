<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Userland — social game shell (neutral pass 2)</title>
<style>
/* ================================================================
   PASS 2: Discord/Stoat-style SOCIAL GAME SHELL — still neutral.
   Builds on userland-stoat-pure-chat.html. NO Userland/Bento skin.
   Renames: Nitro→Patron, Shop→Blackmarket, Quests→Runs,
   Friends→Contacts, Servers→Crews/Zones.
   ================================================================ */
:root{
  --bg-0:#141518; --bg-1:#1b1d22; --bg-2:#232529; --bg-3:#2b2e34; --bg-4:#34373e;
  --txt:#e3e5e8; --txt-2:#9a9da3; --txt-3:#6c6f76;
  --accent:#6573e8; --accent-2:#4853b8;
  --ok:#3aa55d; --warn:#d8b13c; --danger:#d84040; --gold:#d8a83c;
  --r:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg-2);color:var(--txt);font-size:14px;line-height:1.45;overflow:hidden}
button{font-family:inherit;border:0;cursor:pointer}
.app{display:flex;height:100%}

/* ============ crew/server rail ============ */
.rail{width:64px;flex:none;background:var(--bg-0);display:flex;flex-direction:column;
  align-items:center;gap:10px;padding:12px 0;overflow-y:auto}
.rail__srv{width:44px;height:44px;border-radius:50%;background:var(--bg-3);color:var(--txt);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;
  cursor:pointer;transition:border-radius .15s,background .15s;flex:none}
.rail__srv:hover{border-radius:14px}
.rail__srv.is-on{border-radius:14px;background:var(--accent);color:#fff}
.rail__sep{width:28px;border-top:1px solid var(--bg-3);flex:none}

/* ============ left nav column ============ */
.chans{width:240px;flex:none;background:var(--bg-1);display:flex;flex-direction:column}
.chans__head{padding:14px 16px;font-weight:700;font-size:15px;border-bottom:1px solid rgba(0,0,0,.25)}
.chans__list{flex:1;overflow-y:auto;padding:10px 8px;display:flex;flex-direction:column;gap:1px}
.chans__label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;
  color:var(--txt-3);padding:12px 8px 4px}
.chan{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:5px;color:var(--txt-2);
  cursor:pointer;font-weight:500}
.chan:hover{background:var(--bg-3);color:var(--txt)}
.chan.is-on{background:var(--bg-3);color:var(--txt)}
.chan .ico{width:18px;text-align:center;color:var(--txt-3);font-size:13px}
.chan .hash{color:var(--txt-3);font-weight:400}
.chan .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chan.has-unread{color:var(--txt);font-weight:600}
.chan .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;display:none}
.chan.has-unread .dot{display:block}
.chan .mini{width:24px;height:24px;border-radius:50%;font-size:11px;display:flex;align-items:center;
  justify-content:center;font-weight:700;color:#fff;flex:none;position:relative}
.chan .mini .st{position:absolute;right:-2px;bottom:-2px;width:9px;height:9px;border-radius:50%;
  border:2px solid var(--bg-1);background:var(--ok)}
.chan .mini .st.idle{background:var(--warn)} .chan .mini .st.dnd{background:var(--danger)}

.me{flex:none;display:flex;align-items:center;gap:8px;padding:8px 10px;background:rgba(0,0,0,.2)}
.me__txt{flex:1;min-width:0;cursor:pointer}
.me__name{font-size:13px;font-weight:600;line-height:1.2}
.me__status{font-size:11px;color:var(--txt-2)}
.me__gear{width:30px;height:30px;border-radius:6px;background:transparent;color:var(--txt-2);font-size:15px}
.me__gear:hover{background:var(--bg-3);color:var(--txt)}

/* ============ main column ============ */
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg-2)}
.chead{flex:none;display:flex;align-items:center;gap:8px;padding:11px 16px;
  border-bottom:1px solid rgba(0,0,0,.25)}
.chead .burger{display:none;width:30px;height:30px;border-radius:6px;background:transparent;
  color:var(--txt-2);font-size:17px}
.chead .hash{color:var(--txt-3);font-size:17px}
.chead .nm{font-weight:700;font-size:15px}
.chead .topic{color:var(--txt-2);font-size:13px;margin-left:8px;border-left:1px solid var(--bg-4);
  padding-left:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* chat view */
.chatview{flex:1;min-height:0;display:flex;flex-direction:column}
.feed{flex:1;min-height:0;overflow-y:auto;padding:14px 16px 4px;display:flex;flex-direction:column}
.convstart{padding:8px 0 14px;margin-bottom:6px;border-bottom:1px solid var(--bg-3)}
.convstart h2{font-size:22px;margin-bottom:2px}
.convstart p{color:var(--txt-2);font-size:13px}
.msg{display:flex;gap:12px;padding:2px 6px;margin-top:14px;border-radius:6px}
.msg:hover{background:rgba(0,0,0,.12)}
.msg.is-grp{margin-top:0}
.msg .ava-slot{width:38px;flex:none}
.msg__col{flex:1;min-width:0}
.msg__head{display:flex;align-items:baseline;gap:7px}
.msg__who{font-weight:600;font-size:14px;cursor:pointer}
.msg__who:hover{text-decoration:underline}
.msg__time{font-size:11px;color:var(--txt-3)}
.msg__body{color:var(--txt);font-size:14px;overflow-wrap:break-word;padding:1px 0}
.ava{width:38px;height:38px;border-radius:50%;flex:none;display:flex;align-items:center;
  justify-content:center;font-weight:700;font-size:14px;color:#fff;cursor:pointer;user-select:none}
.crewtag{font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;background:var(--bg-4);
  color:var(--txt-2);cursor:pointer;letter-spacing:.03em}
.crewtag:hover{background:var(--accent);color:#fff}
.donor{color:var(--gold);font-size:12px;cursor:default}
.sysmsg{display:flex;align-items:center;gap:10px;margin-top:14px;padding:2px 6px;color:var(--txt-2);font-size:13px}
.sysmsg .ico{width:38px;text-align:center;color:var(--txt-3)}

/* embeds / packets */
.embed{width:fit-content;max-width:min(100%,440px);margin-top:6px;background:var(--bg-3);
  border-left:4px solid var(--accent);border-radius:6px;padding:12px 14px;cursor:pointer}
.embed--ok{border-left-color:var(--ok)} .embed--warn{border-left-color:var(--warn)}
.embed--danger{border-left-color:var(--danger)}
.embed__kicker{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;
  color:var(--txt-2);margin-bottom:3px}
.embed__title{font-weight:700;font-size:14px}
.embed__desc{color:var(--txt-2);font-size:13px;margin-top:2px}
.embed__fields{display:flex;gap:18px;margin-top:8px;flex-wrap:wrap}
.embed__field b{display:block;font-size:11px;font-weight:600;color:var(--txt-2);text-transform:uppercase}
.embed__field span{font-size:13px}
.embed__acts{display:flex;gap:8px;margin-top:10px}

.btn{height:32px;padding:0 14px;border-radius:5px;background:var(--bg-4);color:var(--txt);
  font-size:13px;font-weight:600}
.btn:hover{background:#3d4047}
.btn--primary{background:var(--accent);color:#fff}
.btn--primary:hover{background:var(--accent-2)}
.btn--danger{background:var(--danger);color:#fff}
.btn--ghost{background:transparent;color:var(--txt-2)}
.btn--ghost:hover{background:var(--bg-3);color:var(--txt)}
.btn--sm{height:26px;padding:0 10px;font-size:12px}

/* typing + composer + slash menu */
.typing{flex:none;height:20px;padding:0 22px;font-size:12px;color:var(--txt-2);visibility:hidden}
.typing.is-vis{visibility:visible}
.compwrap{position:relative;flex:none;margin:0 16px 18px}
.composer{display:flex;align-items:center;gap:8px;background:var(--bg-4);border-radius:10px;
  padding:6px 8px 6px 12px}
.composer .plus{width:30px;height:30px;border-radius:50%;background:var(--bg-3);color:var(--txt-2);
  font-size:16px;flex:none}
.composer .plus:hover{color:var(--txt)}
.composer input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--txt);
  font-size:14px;font-family:inherit}
.composer input::placeholder{color:var(--txt-3)}
.composer .send{width:32px;height:32px;border-radius:6px;background:transparent;color:var(--accent);
  font-size:17px;flex:none}
.composer .send:hover{background:var(--bg-3)}
.popmenu{position:absolute;left:0;right:0;bottom:calc(100% + 8px);background:var(--bg-1);
  border:1px solid var(--bg-4);border-radius:8px;box-shadow:0 8px 30px rgba(0,0,0,.5);
  max-height:300px;overflow-y:auto;display:none;z-index:30}
.popmenu.is-vis{display:block}
.popmenu__h{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--txt-3);padding:10px 14px 4px}
.cmd{display:flex;align-items:baseline;gap:10px;padding:8px 14px;cursor:pointer}
.cmd:hover,.cmd.is-sel{background:var(--bg-3)}
.cmd b{font-size:13px;font-family:ui-monospace,Menlo,monospace}
.cmd .args{font-size:12px;color:var(--accent)}
.cmd .desc{font-size:12px;color:var(--txt-2);margin-left:auto}

/* ============ pages (Home / Contacts / Requests / Blackmarket / Runs) ============ */
.page{flex:1;min-height:0;overflow-y:auto;padding:22px 26px;display:none}
.page.is-vis{display:block}
.page h1{font-size:20px;margin-bottom:4px}
.page .sub{color:var(--txt-2);font-size:13px;margin-bottom:18px}
.page h3{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
  color:var(--txt-2);margin:20px 0 10px}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.fchip{height:28px;padding:0 12px;border-radius:99px;background:var(--bg-3);color:var(--txt-2);
  font-size:12px;font-weight:600}
.fchip.is-on{background:var(--accent);color:#fff}
.fsort{margin-left:auto;background:var(--bg-3);color:var(--txt-2);border:0;border-radius:5px;
  height:28px;font-size:12px;padding:0 8px;font-family:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{background:var(--bg-3);border-radius:8px;padding:12px;cursor:pointer}
.card:hover{background:var(--bg-4)}
.card__img{height:74px;border-radius:6px;background:var(--bg-4);display:flex;align-items:center;
  justify-content:center;color:var(--txt-3);font-size:11px;margin-bottom:10px}
.card__name{font-weight:700;font-size:14px}
.card__meta{font-size:12px;color:var(--txt-2);margin-top:2px}
.card__price{font-size:13px;font-weight:700;margin-top:8px}
.rarity{font-size:10px;font-weight:700;text-transform:uppercase;padding:1px 6px;border-radius:4px;
  background:var(--bg-2);color:var(--txt-2)}
.runcard{background:var(--bg-3);border-radius:8px;overflow:hidden;cursor:pointer}
.runcard:hover{background:var(--bg-4)}
.runcard__banner{height:64px;display:flex;align-items:flex-end;padding:8px 12px;font-size:11px;
  color:rgba(255,255,255,.8);background:linear-gradient(120deg,#39406b,#2c4a48)}
.runcard__body{padding:10px 12px}
.contact{display:flex;align-items:center;gap:10px;padding:10px;border-radius:6px;cursor:pointer}
.contact:hover{background:var(--bg-3)}
.contact .nm{font-weight:600}
.contact .meta{font-size:12px;color:var(--txt-2)}
.contact .acts{margin-left:auto;display:flex;gap:6px}
.stockrow{display:flex;align-items:center;gap:14px;padding:10px 12px;background:var(--bg-3);
  border-radius:8px;margin-bottom:8px;cursor:pointer}
.stockrow:hover{background:var(--bg-4)}
.stockrow .tk{font-weight:700;font-family:ui-monospace,Menlo,monospace;width:64px}
.stockrow .co{flex:1;color:var(--txt-2);font-size:13px}
.up{color:var(--ok)} .down{color:var(--danger)}

/* ============ modal layer ============ */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;
  justify-content:center;z-index:50;padding:20px}
.scrim.is-vis{display:flex}
.modal{background:var(--bg-1);border-radius:10px;width:460px;max-width:100%;max-height:90vh;
  overflow-y:auto;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.modal--wide{width:760px;display:flex;overflow:hidden;height:min(560px,90vh)}

/* profile modal */
.pf__banner{height:110px;border-radius:10px 10px 0 0;position:relative}
.pf__ava{position:absolute;left:18px;bottom:-28px;width:72px;height:72px;border-radius:50%;
  border:5px solid var(--bg-1)}
.pf__ava .ava{width:100%;height:100%;font-size:24px}
.pf__body{padding:38px 18px 18px}
.pf__name{font-size:19px;font-weight:700;display:flex;align-items:center;gap:8px}
.pf__handle{color:var(--txt-2);font-size:13px}
.pf__status{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:13px;color:var(--txt-2)}
.st-dot{width:9px;height:9px;border-radius:50%;background:var(--ok);display:inline-block}
.st-dot.idle{background:var(--warn)} .st-dot.dnd{background:var(--danger)}
.pf__chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{background:var(--bg-3);border-radius:99px;padding:3px 10px;font-size:12px;color:var(--txt-2)}
.pf__sect{margin-top:14px;background:var(--bg-2);border-radius:8px;padding:10px 12px}
.pf__sect h4{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
  color:var(--txt-2);margin-bottom:6px}
.pf__row{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;color:var(--txt)}
.pf__row span:first-child{color:var(--txt-2)}
.pf__acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.pf__acts .btn{flex:1;min-width:86px}

/* player plates */
.plate{width:150px;height:46px;border-radius:8px;display:flex;align-items:center;padding:0 12px;
  font-size:11px;font-weight:700;color:rgba(255,255,255,.85);position:relative;overflow:hidden}
.plate small{position:absolute;right:8px;bottom:4px;font-size:9px;font-weight:600;opacity:.7}
.plate.is-cur{outline:2px solid var(--accent)}
.plate--default{background:#3a3d45}
.plate--level{background:linear-gradient(110deg,#33415e,#3c5a78)}
.plate--achv{background:linear-gradient(110deg,#4d3a5e,#6a4a86)}
.plate--crew{background:linear-gradient(110deg,#2c4a48,#3a6b62)}
.plate--event{background:linear-gradient(110deg,#5e4a33,#86683a)}
.plate--patron{background:linear-gradient(110deg,#5e3a3a,#9a6230);box-shadow:inset 0 0 0 1px var(--gold)}
.plate--founder{background:linear-gradient(110deg,#222,#444);box-shadow:inset 0 0 0 1px #888}
.platewrap{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}

/* settings modal */
.set__nav{width:200px;flex:none;background:var(--bg-0);padding:18px 10px;display:flex;
  flex-direction:column;gap:2px;overflow-y:auto}
.set__nav h4{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--txt-3);padding:8px 10px 4px}
.set__item{text-align:left;padding:7px 10px;border-radius:5px;background:transparent;
  color:var(--txt-2);font-size:14px;font-weight:500}
.set__item:hover{background:var(--bg-3);color:var(--txt)}
.set__item.is-on{background:var(--bg-3);color:var(--txt)}
.set__item--danger{color:var(--danger)}
.set__content{flex:1;min-width:0;padding:22px;overflow-y:auto}
.set__content h2{font-size:18px;margin-bottom:14px}
.set__card{background:var(--bg-2);border-radius:8px;padding:14px;margin-bottom:10px}
.set__card h4{font-size:12px;font-weight:700;text-transform:uppercase;color:var(--txt-2);margin-bottom:6px}
.set__card p{font-size:13px;color:var(--txt-2)}
.set__close{position:absolute;top:14px;right:16px;width:32px;height:32px;border-radius:50%;
  background:var(--bg-3);color:var(--txt-2);font-size:15px}
.set__close:hover{color:var(--txt)}

/* generic detail modal bits */
.dm__body{padding:18px}
.dm__kicker{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--txt-2)}
.dm__title{font-size:18px;font-weight:700;margin:2px 0 10px}
.dm__acts{display:flex;gap:8px;margin-top:16px;justify-content:flex-end;flex-wrap:wrap}
.dm__img{height:110px;border-radius:8px;background:var(--bg-4);display:flex;align-items:center;
  justify-content:center;color:var(--txt-3);font-size:12px;margin-bottom:12px}
.seller{display:flex;align-items:center;gap:10px;margin:10px 0;cursor:pointer;padding:8px;
  border-radius:6px;background:var(--bg-2)}
.seller:hover{background:var(--bg-3)}
.field{margin-bottom:10px}
.field label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;
  color:var(--txt-2);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;background:var(--bg-2);border:1px solid var(--bg-4);
  border-radius:5px;color:var(--txt);padding:7px 9px;font-size:13px;font-family:inherit;outline:0}
.field input:focus,.field textarea:focus{border-color:var(--accent)}
.tradecols{display:flex;gap:10px}
.tradecols>div{flex:1;background:var(--bg-2);border-radius:8px;padding:10px}
.tradecols h4{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--txt-2);margin-bottom:6px}
.memrow{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px}
.memrow .role{margin-left:auto;font-size:11px;color:var(--txt-3)}

@media (max-width:720px){
  .rail{display:none}
  .chans{position:fixed;inset:0 auto 0 0;z-index:40;transform:translateX(-100%);
    transition:transform .2s ease;width:268px;box-shadow:4px 0 24px rgba(0,0,0,.4)}
  .chans.is-open{transform:none}
  .chead .burger{display:block}
  .modal--wide{flex-direction:column;height:90vh}
  .set__nav{width:100%;flex-direction:row;flex-wrap:wrap;padding:10px}
}
</style>
</head>
<body>

<div class="app">
  <!-- crew/server rail: Home / Current Crew / Other Crews-Zones / + / Discover -->
  <nav class="rail" id="rail">
    <div class="rail__srv is-on" title="Home" data-rail="home">U</div>
    <div class="rail__sep"></div>
    <div class="rail__srv" title="Null Saints (your crew)" data-crew-open="ns" style="background:#2c4a48">NS</div>
    <div class="rail__srv" title="JadeNet" data-crew-open="jn" style="background:#33415e">JN</div>
    <div class="rail__srv" title="Dock Zone 9" data-crew-open="dz" style="background:#4d3a5e">DZ</div>
    <div class="rail__srv" title="Create a crew" data-modal="createCrew">+</div>
    <div class="rail__sep"></div>
    <div class="rail__srv" title="Discover crews & zones">⌕</div>
  </nav>

  <!-- left nav -->
  <aside class="chans" id="chans">
    <div class="chans__head">Userland</div>
    <div class="chans__list" id="nav-list"></div>
    <div class="me">
      <span class="ava" data-profile="ned" style="background:#7b68c9;width:32px;height:32px;font-size:13px">N</span>
      <div class="me__txt" data-profile="ned">
        <div class="me__name">ned <span class="donor" title="Supporter">✦</span></div>
        <div class="me__status">Online</div>
      </div>
      <button class="me__gear" data-modal="settings" title="settings">⚙</button>
    </div>
  </aside>

  <!-- main -->
  <main class="main">
    <div class="chead">
      <button class="burger" id="burger">☰</button>
      <span class="hash" id="ch-ico">#</span><span class="nm" id="ch-name"></span>
      <span class="topic" id="ch-topic"></span>
    </div>

    <!-- chat view -->
    <div class="chatview" id="chatview">
      <div class="feed" id="feed"></div>
      <div class="typing" id="typing"></div>
      <div class="compwrap">
        <div class="popmenu" id="popmenu"></div>
        <div class="composer">
          <button class="plus" id="plus" title="insert packet">+</button>
          <input id="composer-in" placeholder="Message" autocomplete="off">
          <button class="send" id="send" title="send">➤</button>
        </div>
      </div>
    </div>

    <!-- page views -->
    <div class="page" id="page-home"></div>
    <div class="page" id="page-contacts"></div>
    <div class="page" id="page-requests"></div>
    <div class="page" id="page-blackmarket"></div>
    <div class="page" id="page-runs"></div>
  </main>
</div>

<div class="scrim" id="scrim"></div>

<script>
/* ================= data ================= */
const CREWS={
  ns:{tag:'NSX',name:'Null Saints',color:'#2c4a48',banner:'linear-gradient(120deg,#2c4a48,#3a6b62)',
      members:14,rep:'+208 respected',worth:'412,000 SEN',
      runs:[['East Sector Sweep','Medium risk · 3/4'],['Vault Recon','High risk · forming']],
      listings:[['Crew Relay Bundle','3,800 SEN'],['Sector Maps','650 SEN']],

function renderNav(){
  let h='';

    h+=`<div class="chan ${on?'is-on':''}" data-nav="${id}"><span class="ico">${ico}</span><span class="nm">${lbl}</span></div>`;
  });

    const on=state.view==='chat'&&state.chan===id;
    h+=`<div class="chan ${on?'is-on':''} ${state.unread[id]?'has-unread':''}" data-room="${id}">
      <span class="hash">#</span><span class="nm">${lbl}</span><span class="dot"></span></div>`;
  });
  h+='<div class="chans__label">Direct messages</div>';
  DMS.forEach(id=>{
    const u=USERS[id],ch='dm-'+id,on=state.view==='chat'&&state.chan===ch;

/* ================= main view switch ================= */
function show(view){
  state.view=view;
  $('chatview').style.display=view==='chat'?'flex':'none';
  ['home','contacts','requests','blackmarket','runs'].forEach(p=>
    $('page-'+p).classList.toggle('is-vis',view===p));
  if(view!=='chat'){
    const lbl=PRIMARY.find(x=>x[0]===view);
    $('ch-ico').textContent='';
    $('ch-name').textContent=lbl?lbl[1]:view;
    $('ch-topic').textContent='';
    PAGES[view]&&PAGES[view]();
  }
  renderNav();
  $('chans').classList.remove('is-open');
}

/* ================= chat ================= */
function openRoom(ch){
  state.chan=ch;delete state.unread[ch];show('chat');renderFeed();
}
function renderFeed(){
  let label,topic,icon='#';
  if(state.chan.startsWith('dm-')){
    const u=USERS[state.chan.slice(3)];label=u.name;topic='Direct message';icon='@';
  }else{
    const r=ROOMS.find(x=>x[0]===state.chan);label=r[1];topic=r[2];
  }
  $('ch-ico').textContent=icon;$('ch-name').textContent=label;$('ch-topic').textContent=topic;
  $('composer-in').placeholder=`Message ${icon==='#'?'#'+label:label} — type / for commands`;

  const list=MSGS[state.chan]||[];
  let h=`<div class="convstart"><h2>${icon} ${label}</h2><p>This is the start of ${icon==='#'?'#'+label:'your conversation with '+label}. ${topic}.</p></div>`;
  let prev=null;
  list.forEach(m=>{
    if(m.sys){h+=`<div class="sysmsg"><span class="ico">→</span>${m.text}</div>`;prev=null;return}
    const u=USERS[m.who];
    const grp=prev&&prev.who===m.who;
    const body=m.embed?renderEmbed(m.embed):esc(m.text);
    if(grp){
      h+=`<div class="msg is-grp"><div class="ava-slot"></div><div class="msg__col"><div class="msg__body">${body}</div></div></div>`;
    }else{
      h+=`<div class="msg"><div class="ava-slot">${avaHtml(m.who)}</div>
        <div class="msg__col"><div class="msg__head">
          <span class="msg__who" data-profile="${m.who}">${u.name}</span>${crewTag(m.who)}${donorMark(m.who)}
          <span class="msg__time">${m.t}</span></div>
        <div class="msg__body">${body}</div></div></div>`;
    }
    prev=m;
  });
  $('feed').innerHTML=h;
  $('feed').scrollTop=$('feed').scrollHeight;
}
function renderEmbed(e){
  return `<div class="embed ${e.cls||''}" data-open-kind="${e.kind}" data-open-ref="${e.ref||''}">
    <div class="embed__kicker">${e.kicker}</div>
    <div class="embed__title">${e.title}</div>
    <div class="embed__desc">${e.desc}</div>
    <div class="embed__fields">${e.fields.map(([k,v])=>
      `<div class="embed__field"><b>${k}</b><span>${v}</span></div>`).join('')}</div>
    <div class="embed__acts">${e.acts.map(([lbl],i)=>
      `<button class="btn btn--sm ${i===0?'btn--primary':''}">${lbl}</button>`).join('')}</div>
  </div>`;
}

/* ================= composer: slash commands + packet menu ================= */
let menuMode=null; // 'cmd' | 'packet'
function renderCmdMenu(filter){
  const items=COMMANDS.filter(([c])=>c.startsWith(filter||'/'));
  if(!items.length)return hideMenu();
  $('popmenu').innerHTML='<div class="popmenu__h">Commands</div>'+items.map(([c,a,d],i)=>
    `<div class="cmd ${i===0?'is-sel':''}" data-cmd="${c}"><b>${c}</b><span class="args">${a}</span><span class="desc">${d}</span></div>`).join('');
  $('popmenu').classList.add('is-vis');menuMode='cmd';
}
function renderPacketMenu(){
  $('popmenu').innerHTML='<div class="popmenu__h">Insert activity packet</div>'+PACKETS.map(([lbl],i)=>
    `<div class="cmd" data-packet="${i}"><b>${lbl}</b><span class="desc">insert into chat</span></div>`).join('');
  $('popmenu').classList.add('is-vis');menuMode='packet';
}
function hideMenu(){$('popmenu').classList.remove('is-vis');$('popmenu').innerHTML='';menuMode=null}

function runCommand(cmd){
  hideMenu();$('composer-in').value='';
  switch(cmd){
    case '/sell':   openModal('listing',{title:'New listing — sell an item'});break;
    case '/run':    openModal('run',{id:'east'});break;
    case '/hack':   openModal('hack',{id:'vera'});break;
    case '/trade':  openModal('trade',{id:'marco'});break;
    case '/stock':  openModal('stock',{id:'RELAY'});break;
    case '/crew':   openModal('createCrew',{});break;
    case '/profile':openModal('profile',{id:'peggy'});break;
    case '/item':   openModal('item',{});break;
    case '/market': show('blackmarket');break;
    case '/invite': insertPacket(E.run('east'));break;
  }
}
function insertPacket(embed){
  hideMenu();
  (MSGS[state.chan]||(MSGS[state.chan]=[])).push({who:'ned',t:'now',embed});
  renderFeed();
}

function send(){
  const inp=$('composer-in');const txt=inp.value.trim();
  if(!txt)return;
  if(txt.startsWith('/')){runCommand(txt.split(' ')[0]);return}
  inp.value='';hideMenu();
  MSGS[state.chan].push({who:'ned',t:'now',text:txt});
  renderFeed();
  if(['dm-peggy','global'].includes(state.chan)){
    const ty=$('typing');
    setTimeout(()=>{ty.textContent='Peggy Woo is typing…';ty.classList.add('is-vis')},500);
    setTimeout(()=>{ty.classList.remove('is-vis');
      MSGS[state.chan].push({who:'peggy',t:'now',text:'Noted.'});renderFeed()},1700);
  }
}

/* ================= events ================= */
document.addEventListener('click',e=>{
  const t=e.target;

  // modal-internal triggers first (so they work inside scrim)
  const sp=t.closest('[data-set-page]');
  if(sp){openModal('settings',{page:sp.dataset.setPage});return}
  if(t.closest('[data-close]')){
    const room=t.closest('[data-room]');
    closeModal();
    if(room)openRoom(room.dataset.room);
    return;
  }
  const crew=t.closest('[data-crew]');
  if(crew){openModal('crew',{id:crew.dataset.crew});return}
  const crewOpen=t.closest('[data-crew-open]');
  if(crewOpen){openModal('crew',{id:crewOpen.dataset.crewOpen});return}
  // room wins when the data-room element is nested inside a data-profile row
  const roomEl=t.closest('[data-room]');
  const profEl=t.closest('[data-profile]');
  if(roomEl&&(!profEl||profEl.contains(roomEl))){openRoom(roomEl.dataset.room);return}
  if(profEl){openModal('profile',{id:profEl.dataset.profile});return}
  const mod=t.closest('[data-modal]');
  if(mod){openModal(mod.dataset.modal,{});return}
  const ok=t.closest('[data-open-kind]');
  if(ok){openByKind(ok.dataset.openKind,ok.dataset.openRef);return}

  if(t.id==='scrim'){closeModal();return}

  // nav
  const nav=t.closest('[data-nav]');
  if(nav){
    const v=nav.dataset.nav;
    if(v==='patron'){openModal('patron',{});return}
    if(v==='home'&&state.view==='home'){return}
    show(v==='home'?'home':v);return;
  }
  const rail=t.closest('[data-rail]');
  if(rail){show('home');return}

  if(t.closest('#burger')){$('chans').classList.toggle('is-open');return}
  if(t.closest('#plus')){menuMode==='packet'?hideMenu():renderPacketMenu();return}
  const cmd=t.closest('[data-cmd]');
  if(cmd){runCommand(cmd.dataset.cmd);return}
  const pk=t.closest('[data-packet]');
  if(pk){insertPacket(PACKETS[+pk.dataset.packet][1]());return}
  if(t.closest('#send')){send();return}

  if(!t.closest('#popmenu')&&!t.closest('.composer'))hideMenu();
});

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){hideMenu();closeModal()}
});
$('composer-in').addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    const v=$('composer-in').value.trim();
    if(menuMode==='cmd'&&v.startsWith('/')){
      const first=COMMANDS.find(([c])=>c.startsWith(v.split(' ')[0]));
      runCommand(first?first[0]:v.split(' ')[0]);
    }else send();
  }
});
$('composer-in').addEventListener('input',e=>{
  const v=e.target.value;
  if(v.startsWith('/'))renderCmdMenu(v.split(' ')[0]);
  else if(menuMode==='cmd')hideMenu();
});

renderNav();
renderFeed();
